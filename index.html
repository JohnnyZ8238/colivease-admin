<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ColivEase Admin</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* The ColivEase look (same as www.colivease.ca): grid paper, glass cards, Fredoka headings, Poppins text, ColivEase
   blue on navy ink, pill buttons. */
:root {
  --ink: #0B2255; --ink-2: #33415C; --muted: #64748B; --faint: #94A3B8; --line: #E2E8F0; --soft: #F1F5FF; --bg: #F5F7FB;
  --blue: #2865FF; --blue-2: #4F83FF; --blue-deep: #1A4FE0; --blue-soft: #E7EFFE;
  --green: #15803D; --green-soft: #DCFCE7; --red: #DC2626; --red-soft: #FEE2E2; --amber: #B45309; --amber-soft: #FEF3C7;
  --glass: rgba(255,255,255,.86); --white: #fff;
  --display: Fredoka, "Poppins", system-ui, sans-serif; --body: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 2px rgba(11,34,85,.04), 0 18px 40px -26px rgba(11,34,85,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(rgba(40,101,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(40,101,255,.05) 1px, transparent 1px); background-size: 44px 44px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.2px; }

/* brand */
.brand { display: flex; align-items: center; gap: 10px; font: 700 20px var(--display); color: var(--ink); }
.mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue-2), var(--blue-deep)); color: #fff; font: 700 21px var(--display); box-shadow: 0 8px 18px -8px rgba(40,101,255,.8); }
.brand small { font: 600 11px var(--body); color: var(--blue); background: var(--blue-soft); padding: 2px 8px; border-radius: 999px; }
.brand img { height: 46px; width: auto; display: block; }
.side .brand img { height: 52px; }

/* sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.card { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(226,232,240,.9); border-radius: 22px; box-shadow: var(--shadow); }
.signin .card { width: 100%; max-width: 430px; padding: 32px; display: grid; gap: 16px; }
.signin h1 { margin: 6px 0 0; font-size: 30px; }
.signin p { margin: 0; color: var(--muted); }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: 13px; color: var(--ink); }
.input, select.input, textarea.input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--white); outline: none; font-weight: 400; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(40,101,255,.12); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
details summary { cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font: 600 13px var(--body); white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s, transform .1s; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 10px 22px -12px rgba(40,101,255,.9); }
.btn.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue); }
.btn.ghost:hover { background: var(--blue-soft); }
.btn.danger { color: var(--red); border-color: #FCA5A5; }
.btn.danger:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { height: 32px; padding: 0 12px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.error { color: var(--red); font-size: 13px; min-height: 1em; }
.notice { padding: 12px 14px; border-radius: 14px; background: var(--amber-soft); color: #78350F; font-size: 13px; }
.notice.blue { background: var(--blue-soft); color: var(--ink); }

/* shell */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.side { padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-right: 1px solid var(--line); }
.side .brand { padding: 4px 8px 20px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-weight: 500; text-align: left; transition: background-color .15s, color .15s; }
.nav button:hover { background: var(--soft); color: var(--ink); }
.nav button.on { background: var(--blue); color: #fff; box-shadow: 0 10px 20px -12px rgba(40,101,255,.9); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; background: #F59E0B; color: #111; font-size: 11px; font-weight: 700; text-align: center; line-height: 20px; }
.side .who { margin-top: auto; padding: 14px; border-radius: 18px; background: var(--white); border: 1px solid var(--line); font-size: 12px; display: grid; gap: 8px; }
.side .who b { color: var(--ink); word-break: break-all; font-size: 13px; }
.side .who .row { gap: 6px; }
.main { padding: 28px 34px 64px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h2 { margin: 0; font-size: 30px; }
.head p { margin: 2px 0 0; color: var(--muted); max-width: 70ch; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools .input { width: 280px; border-radius: 999px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { padding: 18px; }
.stat small { color: var(--muted); font-weight: 500; }
.stat b { display: block; font: 700 30px var(--display); margin-top: 2px; color: var(--ink); }
.stat em { font-style: normal; font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.panel { padding: 20px; min-width: 0; }
.panel h3 { margin: 0 0 12px; font-size: 18px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
.bars div { flex: 1; display: grid; align-content: end; justify-items: center; gap: 4px; height: 100%; font-size: 10px; color: var(--muted); }
.bars span { width: 100%; max-width: 26px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--blue-2), var(--blue)); min-height: 3px; }

/* tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: rgba(231,239,254,.45); }
td .sub, .item .sub { display: block; color: var(--muted); font-size: 12px; }
.empty { padding: 44px; text-align: center; color: var(--muted); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* drawer + dialog */
.scrim { position: fixed; inset: 0; background: rgba(11,34,85,.32); backdrop-filter: blur(3px); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--white); z-index: 21; overflow-y: auto; padding: 26px; box-shadow: -24px 0 60px -24px rgba(11,34,85,.4); display: grid; align-content: start; gap: 20px; border-radius: 24px 0 0 24px; }
.drawer h3 { margin: 0; font-size: 24px; }
.drawer section { display: grid; gap: 10px; }
.drawer h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.toggle input { width: 18px; height: 18px; accent-color: var(--blue); }
.list { display: grid; gap: 8px; }
.list .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); }
.dialog { position: fixed; z-index: 31; left: 50%; top: 50%; translate: -50% -50%; width: min(470px, calc(100vw - 32px)); padding: 24px; display: grid; gap: 14px; background: var(--white); }
.dialog h3 { margin: 0; font-size: 22px; }
.close { position: absolute; top: 16px; right: 16px; }

/* chat transcript */
.msgs { display: grid; gap: 8px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; background: var(--soft); position: relative; }
.msg.me { justify-self: end; background: var(--blue); color: #fff; }
.msg.me small { color: rgba(255,255,255,.8); }
.msg.system { justify-self: center; background: transparent; color: var(--muted); font-size: 12px; text-align: center; }
.msg small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.msg.can-del { padding-right: 56px; }
.msg .del { position: absolute; top: 6px; right: 6px; }
.toast { position: fixed; bottom: 22px; left: 50%; translate: -50% 0; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; z-index: 40; font-weight: 500; box-shadow: var(--shadow); }
.matrix td, .matrix th { text-align: center; }
.tabs { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--soft); gap: 2px; }
.tabs button { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button.on { background: var(--white); color: var(--ink); box-shadow: 0 2px 8px rgba(11,34,85,.12); }
.channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
.channel { padding: 18px; display: grid; gap: 8px; align-content: start; }
.channel h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: #22C55E; box-shadow: 0 0 0 4px rgba(34,197,94,.15); }
.dot.off { background: #F59E0B; box-shadow: 0 0 0 4px rgba(245,158,11,.15); }
.cat { margin: 18px 0 8px; font: 700 15px var(--display); color: var(--ink); }
.tpl { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tpl:last-child { border-bottom: 0; }
.tpl:hover { background: rgba(231,239,254,.45); }
.tpl .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl > div:first-child { min-width: 0; }
.vars { display: flex; flex-wrap: wrap; gap: 6px; }
.var { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px dashed #A7C1FF; background: var(--blue-soft); color: var(--blue); font: 600 12px var(--body); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preview { width: 100%; height: 560px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); }
.pushcard { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); }
.pushcard .mark { width: 34px; height: 34px; font-size: 18px; border-radius: 10px; }
@media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
/* staff permissions, grants */
.perms { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px 20px; }
.perms fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; align-content: start; }
.perms legend { font: 600 12px var(--body); color: var(--muted); letter-spacing: .3px; padding: 0; margin-bottom: 4px; }
.perms .toggle { font-size: 13px; }
.staff { padding: 20px; display: grid; gap: 14px; margin-bottom: 14px; }
.staff-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.input.sm { height: 34px; padding: 0 10px; width: auto; border-radius: 12px; }
.input.num { width: 84px; }
.grant { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; }
.grant b { font-size: 13px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .brand, .side .who { display: none; }
  .nav { display: contents; }
  .nav button { width: auto; }
  .main { padding: 18px 16px 50px; }
  .grid2 { grid-template-columns: 1fr; }
  .tools .input { width: 100%; }
  .drawer { border-radius: 0; }
}
</style>
</head>
<body>

<div class="signin" id="signin" hidden>
  <form class="card" id="signin-form">
    <div class="brand"><img src="logo.png" alt="ColivEase"><small>Admin</small></div>
    <div><h1>Sign in</h1><p>Admins only. Every action is recorded.</p></div>
    <label class="field">Email<input class="input" id="email" type="email" autocomplete="username" required></label>
    <label class="field" id="pw-field">Password<input class="input" id="password" type="password" autocomplete="current-password"></label>
    <div class="notice blue" id="sent-note" hidden></div>
    <label class="field" id="code-field" hidden>Or enter the code from the email<input class="input" id="code" inputmode="numeric" autocomplete="one-time-code"></label>
    <div class="error" id="signin-error"></div>
    <button class="btn primary" id="signin-go" type="submit">Sign in</button>
    <button class="btn ghost" id="link-go" type="button">First time, or forgot your password? Email me a sign-in link</button>
    <details id="api-box"><summary class="hint">Server</summary><label class="field" style="margin-top:8px">Server address<input class="input" id="api" required><span class="hint">The ColivEase backend. For local testing: http://localhost:8787</span></label></details>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brand"><img src="logo.png" alt="ColivEase"><small>Admin</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span class="hint">Signed in as</span><b id="who-email"></b><span id="who-role" class="tag blue" style="justify-self:start"></span><div class="row"><button class="btn small" id="setpw">Password</button><button class="btn small" id="signout">Sign out</button></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  const fmt = (ts) => (ts ? new Date(ts).toLocaleString("en-CA", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—");
  const ago = (ts) => {
    if (!ts) return "—";
    const m = Math.round((Date.now() - ts) / 6e4);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
  };
  const plural = (n, one, many = `${one}s`) => `${n} ${1 === n ? one : many}`;
  const LANG = { zh: "Chinese", en: "English", ko: "Korean", es: "Spanish", fr: "French", hi: "Hindi/Punjabi", vi: "Vietnamese", tl: "Tagalog", fa: "Farsi", pt: "Portuguese" };
  const KIND = { roommate: "Roommate", group: "Group", host: "Landlord / sublet", landlord: "Landlord", realtor: "Agent", direct: "Direct", listing: "Home inquiry", team: "Team" };
  const ROLE = { owner: "Owner", admin: "Admin", moderator: "Moderator", support: "Support", custom: "Custom" };
  const txt = (v) => (typeof v === "string" ? v : v?.en || v?.zh || "");
  const enc = encodeURIComponent;
  const DAY = 864e5;
  const day = (ts) => (ts ? new Date(ts).toLocaleDateString("en-CA", { year: "numeric", month: "short", day: "numeric" }) : "—");
  const count = (v) => (Array.isArray(v) ? v.length : Number(v) || 0);
  const TIER = { gold: ["Gold", "amber"], diamond: ["Diamond", "blue"] };
  const PLAN = { agent5: "Agent 5 homes", agent10: "Agent 10 homes" };
  const tierOf = (a) => a?.tier || a?.entitlements?.tier || null;
  const tierTag = (t) => (TIER[t] ? `<span class="tag ${TIER[t][1]}">${TIER[t][0]}</span>` : "");
  // Permissions (cv_admins.perms on the server; docs/API_PRODUCTION.md "Admin additions"), grouped for people.
  const PERM_GROUPS = [
    ["Users", [["users.read", "See users"], ["users.write", "Edit users and notes"], ["users.suspend", "Suspend and sign out"], ["users.delete", "Delete accounts"]]],
    ["Homes", [["listings.read", "See homes"], ["listings.review", "Approve, reject, take down"], ["listings.pin", "Pin homes for free"]]],
    ["Plans & badges", [["plans.grant", "Give memberships, agent plans and credits"], ["badges.grant", "Give badges and verification"], ["agents.review", "Review agent and landlord applications"]]],
    ["Safety", [["chats.read", "Read chats (recorded)"], ["reports.read", "See reports"], ["reports.write", "Handle reports"]]],
    ["Site", [["settings.write", "Site settings"], ["notify.write", "Notification templates"], ["broadcast", "Send broadcasts"]]],
    ["Team", [["staff.write", "Manage staff"], ["testers.write", "Test accounts"], ["audit.read", "See the audit log"]]],
  ];
  const ALL_PERMS = PERM_GROUPS.flatMap(([, list]) => list.map(([p]) => p));
  const TEMPLATES = {
    admin: ALL_PERMS.filter((p) => "staff.write" !== p),
    moderator: ["users.read", "users.suspend", "listings.read", "listings.review", "chats.read", "reports.read", "reports.write", "audit.read", "agents.review"],
    support: ["users.read", "listings.read", "reports.read", "chats.read"],
  };
  // Older servers sent role-based permission names; map them to the new ones.
  const LEGACY_PERMS = { "listings.write": ["listings.review", "listings.pin"], "plans.write": ["plans.grant", "badges.grant"], "admins.write": ["staff.write", "testers.write"], "settings.write": ["notify.write"], "users.write": ["users.suspend"] };
  const templateOf = (perms) => Object.keys(TEMPLATES).find((t) => TEMPLATES[t].length === perms.length && TEMPLATES[t].every((p) => perms.includes(p))) || null;
  const ACTION = {
    "account.signout": "Signed out everywhere", "account.suspend": "Suspended account", "account.unsuspend": "Lifted suspension", "account.update": "Edited account", "account.plans": "Changed membership / mode", "account.delete": "Deleted account", "account.grant": "Gave a plan, badge or credits",
    "listing.update": "Changed home status", "listing.approve": "Approved home", "listing.reject": "Rejected home", "listing.delete": "Deleted home", "listing.pin": "Pinned a home", "listing.unpin": "Unpinned a home", "chat.read": "Read a chat", "chat.message.delete": "Deleted a message", "report.update": "Handled report", "report.resolve": "Resolved a report",
    "broadcast": "Sent a broadcast", "settings.update": "Changed site settings", "admin.set": "Set admin role", "admin.remove": "Removed admin", "staff.set": "Changed staff permissions", "staff.add": "Added staff", "staff.remove": "Removed staff",
    "testers.create": "Created test accounts", "act-as": "Opened a test account", "act_as": "Opened a test account", "agent.approve": "Approved an agent", "agent.reject": "Rejected an agent", "landlord.approve": "Approved a landlord", "landlord.reject": "Rejected a landlord", "agents.decision": "Decided an agent application",
    "notify.template": "Edited a notification", "notify.template.reset": "Reset a notification",
  };
  const ICON = {
    overview: '<path d="M3 13h8V3H3zM13 21h8v-8h-8zM3 21h8v-6H3zM13 3v8h8V3z"/>',

  // The project's public anon key (safe in a web page; it only gets requests past Supabase's gateway — the function
  // checks the ColivEase session in x-cv-token). Filled in by scripts/web/assemble-admin.mjs.
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3YW15Z29yZnhiZHB6YW93b21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTY4NjEsImV4cCI6MjEwODI3Mjg2MX0.FW7PuZi3HY6nZhezMHE6VdWtPznYiZpWoQEZRZUWj-4";

  async function api(method, path, body) {
    const r = await fetch(API.replace(/\/$/, "") + path, {
      method,
      headers: API.includes(".supabase.co")
        ? { "content-type": "application/json", apikey: ANON_KEY, authorization: `Bearer ${ANON_KEY}`, ...(TOKEN ? { "x-cv-token": TOKEN } : {}) }
        : { "content-type": "application/json", ...(TOKEN ? { authorization: `Bearer ${TOKEN}` } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    }).catch(() => { throw new Error(API === DEFAULT_API && !LOCAL ? "Can't reach the ColivEase backend right now. Try again in a moment." : "Can't reach the server. Check the address under “Server”, and that the server is running."); });
    const json = await r.json().catch(() => ({}));
    if (401 === r.status && TOKEN && !path.startsWith("/api/auth/")) { signOut(); throw new Error("Your session expired. Sign in again."); }
    if (!r.ok) {
      const route = `${method} ${path.replace(/^\/api/, "").split("?")[0]}`;

  }

      const box = document.createElement("form");
      box.className = "card dialog";

      const done = (v) => { scrim.remove(); box.remove(); resolve(v); };

      box.querySelector("[data-x]").onclick = () => done(null);
      box.onsubmit = (e) => {
        e.preventDefault();
        done(Object.fromEntries(new FormData(box)));
      };
      document.body.append(scrim, box);
      (box.querySelector("input,textarea,select") || box.querySelector("button.primary,button.danger")).focus();
    });
  }

  // ---- sign-in: email + password; the first time (or a forgotten password) by a link in an email

  };

    e.preventDefault();
    const email = readForm();
    $("#signin-go").disabled = true;
    try {
      if (codeSent && $("#code").value.trim()) await finishSignIn(await api("POST", "/api/auth/verify", { email, code: $("#code").value.trim() }));
      else await finishSignIn(await api("POST", "/api/auth/password", { email, password: $("#password").value }));
    } catch (e2) {
      $("#signin-error").textContent = 401 === e2.status ? "Wrong email or password. No password yet? Use the sign-in link below the first time." : e2.message;
    } finally {
      $("#signin-go").disabled = false;
    }
  };
  $("#link-go").onclick = async () => {
    const email = readForm();

      const r = await api("POST", "/api/auth/start", { email, redirectTo: location.origin + location.pathname });

  // Homes: review state, pin and the 60-day expiry, worked out the same way everywhere in the panel.
  const HSTAT = { pending: ["Waiting", "amber"], visible: ["Live", "green"], rejected: ["Not approved", "red"], hidden: ["Taken down", ""], auto_hidden: ["Hidden by reports", "red"] };
  function homeInfo(l) {
    const m = l.moderation || {};
    const t = Date.now();
    const pinnedUntil = l.pinnedUntil ?? m.pinnedUntil ?? null;
    const pinned = Boolean((pinnedUntil && pinnedUntil > t) || l.planPinned || (l.pinned && !pinnedUntil));
    const base = l.renewedAt || l.postedAt || l.createdAt || null;
    const expiresAt = l.expiresAt ?? (base ? base + 60 * DAY : null);
    const raw = m.status || l.status || "pending";
    const autoHidden = Boolean(l.autoHidden || m.autoHidden || ["auto_hidden", "autohidden", "reported"].includes(raw));
    return { status: autoHidden ? "auto_hidden" : raw, autoHidden, pinned, pinnedUntil: pinnedUntil && pinnedUntil > t ? pinnedUntil : null, expiresAt, expired: Boolean(!pinned && expiresAt && expiresAt < t), reports: count(l.reports ?? m.reports ?? l.reportCount), note: m.note || l.note || "" };
  }
  const statusTag = (h) => `<span class="tag ${HSTAT[h.status]?.[1] || ""}">${HSTAT[h.status]?.[0] || esc(h.status)}</span>`;
  const pinText = (h) => (h.pinned ? (h.pinnedUntil ? `Pinned until ${day(h.pinnedUntil)}` : "Pinned (agent plan)") : "Not pinned");
  const expiryText = (h) => (h.pinned ? "Doesn't expire while pinned" : !h.expiresAt ? "Expiry unknown" : h.expired ? `Expired ${day(h.expiresAt)}` : `Expires ${day(h.expiresAt)}`);
  const priceText = (l) => (l.priceNegotiable || null == l.price ? "Negotiable" : `$${esc(l.price)}`);
  const BADGES = [["verified", "Verified"], ["agent", "Licensed agent"], ["captain", "Captain"], ["student", "Student"], ["landlord", "Landlord"]];
  const rawId = (id) => String(id || "").replace(/^acct:/, "");

  // Test accounts: the server hands back a session for that account; the website signs in with it (#cv-token=).
  async function actAs(accountId) {
    const w = window.open("about:blank", "_blank");
    try {
      const { token } = await api("POST", "/api/admin/act-as", { accountId });
      if (!token) throw new Error("The server didn't send a session for this account.");
      const url = `https://www.colivease.ca/app.html#cv-token=${enc(token)}`;
      if (w) {
        w.opener = null;
        w.location.href = url;
        toast("Opened in a new tab as the test account");
      } else await dialog({ title: "Open the test account", body: `<p class="hint">Your browser blocked the new tab.</p><p><a href="${esc(url)}" target="_blank" rel="noopener">Open ColivEase as this account</a></p>`, confirm: "Done" });
    } catch (e) {
      w?.close();
      toast(e.message);
    }
  }
  const grantTo = async (id, body, msg) => {
    try { await api("POST", `/api/admin/accounts/${enc(id)}/grant`, body); toast(msg); return true; } catch (e) { toast(e.message); return false; }
  };

  async function openAccount(id) {
    let a;
    try { a = await api("GET", `/api/admin/accounts/${enc(id)}`); } catch (e) { return toast(e.message); }
    const p = a.profile || {};
    const name = txt(p.name) || txt(a.name);
    const e = a.entitlements || {};
    const badges = e.badges || a.badges || [];
    const verifiedUntil = e.verifiedUntil || null;
    const isVerified = Boolean((verifiedUntil && verifiedUntil > Date.now()) || badges.includes("verified") || a.verified);
    const extraBadges = badges.filter((b) => !BADGES.some(([k]) => k === b));
    const homes = Array.isArray(a.homes) ? a.homes : Array.isArray(a.listings) ? a.listings : [];
    const threads = (a.threads || a.conversations || []).map((c) => normThread(c, a.people || {}));
    const reports = a.reports || [];
    const app = a.agentApplication;
    const isStaffOwner = "owner" === a.adminRole || a.owner;
    const v = e.verified || {};
    const yes = (b) => (b ? "✓" : "—");
    const el = drawer(`
      <div><h3>${esc(name || "(no name)")}</h3><p class="hint">${esc(a.email || "")} · ${esc(a.id)}</p>
        <div class="tags" style="margin-top:6px">${"agent" === a.kind ? `<span class="tag amber">Agent account</span>` : `<span class="tag">Member account</span>`}${a.test ? `<span class="tag blue">Test account</span>` : ""}${tierTag(e.tier || a.tier)}${badges.map((b) => `<span class="tag green">${esc(BADGES.find(([k]) => k === b)?.[1] || b)}</span>`).join("")}</div></div>
      ${a.test && can("testers.write") ? `<div class="notice blue row" style="justify-content:space-between"><span>Test account: only other test accounts and staff can see it.</span><button class="btn small primary" id="act-as">Open as this account</button></div>` : ""}
      ${a.suspended ? `<div class="notice">Suspended: ${esc(a.suspendReason || "no reason given")}</div>` : ""}
      <section><h4>PROFILE</h4><div class="kv">
        <span>Community</span><span>${esc((a.languages || p.languages || []).map((k) => LANG[k] || k).join(", ") || "—")}</span>
        <span>Joined</span><span>${fmt(a.createdAt)}</span>
        <span>Last active</span><span>${fmt(a.lastActive)}</span>
        ${a.sessions != null ? `<span>Signed in on</span><span>${plural(a.sessions, "device")}</span>` : ""}
        <span>Age / areas</span><span>${esc(p.age ?? "—")} / ${esc((Array.isArray(p.areas) ? p.areas.join(", ") : p.district ?? p.area) || "—")}</span>
        <span>Budget</span><span>${p.budget ? esc(Array.isArray(p.budget) ? p.budget.map((n) => `$${n}`).join(" – ") : p.budget) : "—"}</span>
        <span>About</span><span>${esc(txt(p.bio) || "—")}</span>
      </div></section>
      <section><h4>PLANS & CREDITS</h4><div class="kv">
        <span>Membership</span><span>${TIER[e.tier] ? `${TIER[e.tier][0]}${e.tierUntil ? ` until ${day(e.tierUntil)}` : ""}` : "Free"}</span>
        <span>Agent plan</span><span>${PLAN[e.agentPlan] ? `${PLAN[e.agentPlan]}${e.agentUntil ? ` until ${day(e.agentUntil)}` : ""}` : "None"}</span>
        <span>Invite credits</span><span>${esc(e.inviteCredits ?? 0)} · ${esc(e.invitesToday ?? 0)} sent today (${esc(e.freeInvitesPerDay ?? 3)} free a day, max ${esc(e.maxInvitesPerDay ?? 50)})</span>
        <span>Lease checks</span><span>${esc(e.leaseChecks ?? 0)}</span>
        <span>Contract credits</span><span>${esc(e.contractCredits ?? 0)}</span>
        <span>Verification</span><span>Email ${yes(v.email)} · Phone ${yes(v.phone)} · ID ${yes(v.identity)}${verifiedUntil ? ` · badge until ${day(verifiedUntil)}` : ""}</span>
        <span>Teams</span><span>${esc(e.teamsCreated ?? 0)} of ${esc(e.teamLimit ?? "—")} created</span>
        <span>Live homes</span><span>${esc(e.liveListings ?? 0)} of ${esc(e.listingLimit ?? "—")}</span>
      </div>${a.entitlements ? "" : `<p class="hint">The server didn't send plan details for this account.</p>`}</section>
      ${can("plans.grant") || can("badges.grant") ? `<section><h4>GIVE FOR FREE</h4><p class="hint">No payment and no checks. It applies right away.</p>
        ${can("plans.grant") ? `
        <div class="grant"><b>Membership</b><div class="row"><select class="input sm" id="g-tier"><option value="gold">Gold</option><option value="diamond" ${"diamond" === e.tier ? "selected" : ""}>Diamond</option></select><span class="hint">for</span><input class="input sm num" id="g-tier-days" type="number" min="1" max="3650" value="30"><span class="hint">days</span><button class="btn small primary" id="g-tier-go">Give</button>${TIER[e.tier] ? `<button class="btn small danger" id="g-tier-rm">Remove</button>` : ""}</div></div>
        <div class="grant"><b>Agent plan</b><div class="row"><select class="input sm" id="g-plan"><option value="agent5">5 live homes</option><option value="agent10" ${"agent10" === e.agentPlan ? "selected" : ""}>10 live homes</option></select><span class="hint">for</span><input class="input sm num" id="g-plan-days" type="number" min="1" max="3650" value="30"><span class="hint">days</span><button class="btn small primary" id="g-plan-go">Give</button>${PLAN[e.agentPlan] ? `<button class="btn small danger" id="g-plan-rm">Remove</button>` : ""}</div>${"agent" === a.kind ? "" : `<span class="hint">Agent plans only matter for agent accounts.</span>`}</div>
        <div class="grant"><b>Credits</b><span class="hint">Sets each balance to the number you enter.</span><div class="row">
          <label class="field">Invites<input class="input sm num" id="g-inv" type="number" min="0" max="10000" value="${esc(e.inviteCredits ?? 0)}"></label>
          <label class="field">Lease checks<input class="input sm num" id="g-lease" type="number" min="0" max="1000" value="${esc(e.leaseChecks ?? 0)}"></label>
          <label class="field">Contracts<input class="input sm num" id="g-contract" type="number" min="0" max="1000" value="${esc(e.contractCredits ?? 0)}"></label>
        </div><div><button class="btn small primary" id="g-credits-go">Save credits</button></div></div>` : ""}
        ${can("badges.grant") ? `
        <div class="grant"><b>Verified badge</b><div class="row"><span class="hint">for</span><input class="input sm num" id="g-ver-years" type="number" min="1" max="10" value="3"><span class="hint">years</span><button class="btn small primary" id="g-ver-go">Mark verified</button>${isVerified ? `<button class="btn small danger" id="g-ver-rm">Remove</button>` : ""}</div></div>
        <div class="grant"><b>Badges</b><div class="row">${BADGES.map(([k, l]) => `<label class="toggle"><input type="checkbox" data-badge="${k}" ${badges.includes(k) ? "checked" : ""}>${l}</label>`).join("")}</div>
          <input class="input" id="g-badges-extra" placeholder="Other badges, separated by commas (e.g. early-supporter, ambassador)" value="${esc(extraBadges.join(", "))}">
          <div><button class="btn small primary" id="g-badges-go">Save badges</button></div></div>` : ""}
      </section>` : ""}
      ${app ? `<section><h4>AGENT APPLICATION</h4><div class="kv"><span>Status</span><span>${esc(app.status)}</span><span>Full name</span><span>${esc(app.fullName || "—")}</span><span>RECO number</span><span>${esc(app.reco || "—")} <a href="https://registrantsearch.reco.on.ca/" target="_blank" rel="noopener">Look up</a></span><span>Brokerage</span><span>${esc(app.brokerage || "—")}</span>${app.note ? `<span>Note</span><span>${esc(app.note)}</span>` : ""}</div>${can("agents.review") ? `<div><button class="btn small" id="to-agents">Open agent applications</button></div>` : ""}</section>` : ""}
      ${can("users.write") ? `<section><h4>INTERNAL NOTE</h4><textarea class="input" id="note" rows="2" placeholder="The user never sees this">${esc(a.note || "")}</textarea><div><button class="btn small" id="save-note">Save note</button></div></section>` : ""}
      <section><h4>HOMES POSTED (${homes.length})</h4>${homes.length ? `<div class="list">${homes.map((l) => { const h = homeInfo(l); return `<div class="item"><div>${esc(txt(l.title) || "(no title)")}<span class="sub">${priceText(l)} · ${esc(l.district || "")} · ${pinText(h)} · ${expiryText(h)}</span></div>${statusTag(h)}</div>`; }).join("")}</div>` : `<p class="hint">None.</p>`}</section>
      ${can("chats.read") ? `<section><h4>CHATS (${threads.length})</h4>${threads.length ? `<div class="list">${threads.map((t) => `<div class="item"><div>${esc(t.title || t.members.map((m) => txt(m.name) || m.email || m.id).join(", ") || t.id)}<span class="sub">${KIND[t.kind] || esc(t.kind)} · ${plural(t.count, "message")} · ${ago(t.last)}</span></div><button class="btn small" data-chat="${esc(t.id)}" data-legacy="${t.legacy ? "1" : ""}">Open</button></div>`).join("")}</div>` : `<p class="hint">None.</p>`}</section>` : ""}
      <section><h4>REPORTS THEY MADE (${reports.length})</h4>${reports.length ? `<div class="list">${reports.map((r) => `<div class="item"><div>${esc(REASON[r.reason] || r.reason)}<span class="sub">${esc(r.details ?? r.note ?? "")} · ${ago(r.at ?? r.ts)}</span></div></div>`).join("")}</div>` : `<p class="hint">None.</p>`}</section>
      <section><h4>ACCOUNT</h4><div class="row">
        ${can("users.suspend") && !isStaffOwner ? (a.suspended ? `<button class="btn" id="unsuspend">Lift suspension</button>` : `<button class="btn danger" id="suspend">Suspend</button>`) : ""}
        ${can("users.suspend") ? `<button class="btn" id="kick">Sign out everywhere</button>` : ""}
        ${can("users.delete") && !isStaffOwner ? `<button class="btn danger" id="delete">Delete account</button>` : ""}
      </div></section>`);
    const refresh = () => { openAccount(id); if (["accounts", "members", "testers"].includes(view)) VIEWS[view](); };
    const post = async (body, msg) => { try { await api("POST", `/api/admin/accounts/${enc(id)}`, body); toast(msg); refresh(); } catch (er) { toast(er.message); } };
    const grant = async (body, msg) => { if (await grantTo(id, body, msg)) refresh(); };
    const num = (sel) => Number($(sel, el)?.value);
    const on = (sel, fn) => { const b = $(sel, el); if (b) b.onclick = fn; };
    on("#act-as", () => actAs(a.id));
    on("#to-agents", () => go("agents"));
    on("#save-note", () => post({ note: $("#note", el).value }, "Note saved"));
    on("#g-tier-go", () => { const d = num("#g-tier-days"); if (!(d > 0)) return toast("Enter a number of days"); grant({ tier: $("#g-tier", el).value, tierDays: d }, `${TIER[$("#g-tier", el).value][0]} given for ${plural(d, "day")}`); });
    on("#g-tier-rm", () => grant({ tier: "free", tierDays: 0 }, "Membership removed"));
    on("#g-plan-go", () => { const d = num("#g-plan-days"); if (!(d > 0)) return toast("Enter a number of days"); grant({ agentPlan: $("#g-plan", el).value, agentDays: d }, `Agent plan given for ${plural(d, "day")}`); });
    on("#g-plan-rm", () => grant({ agentPlan: null, agentDays: 0 }, "Agent plan removed"));
    on("#g-credits-go", () => {
      const vals = [num("#g-inv"), num("#g-lease"), num("#g-contract")];
      if (vals.some((x) => !(x >= 0))) return toast("Credits must be 0 or more");
      grant({ inviteCredits: vals[0], leaseChecks: vals[1], contractCredits: vals[2] }, "Credits saved");
    });
    on("#g-ver-go", () => { const y = num("#g-ver-years"); if (!(y > 0)) return toast("Enter a number of years"); grant({ verifiedYears: y }, `Verified for ${plural(y, "year")}`); });
    on("#g-ver-rm", () => grant({ verifiedYears: 0, badges: badges.filter((b) => "verified" !== b) }, "Verified badge removed"));
    on("#g-badges-go", () => {
      const picked = [...el.querySelectorAll("[data-badge]")].filter((c) => c.checked).map((c) => c.dataset.badge);
      const extra = $("#g-badges-extra", el).value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
      grant({ badges: [...new Set([...picked, ...extra])] }, "Badges saved");
    });
    on("#suspend", async () => {
      const r = await dialog({ title: "Suspend this account?", body: `<p class="hint">They're signed out right away and can't sign in again until you lift it.</p>`, fields: [{ name: "reason", label: "Reason", required: true, minlength: 2, placeholder: "e.g. scam, harassment, fake listing" }], confirm: "Suspend", danger: true });
      if (r) post({ suspended: true, reason: r.reason }, "Suspended");
    });
    on("#unsuspend", () => post({ suspended: false, reason: null }, "Suspension lifted"));
    on("#kick", async () => {
      try { await api("POST", `/api/admin/accounts/${enc(id)}/signout`, {}); toast("Signed out everywhere"); refresh(); } catch (er) { toast(er.message); }
    });
    on("#delete", async () => {
      const r = await dialog({ title: "Delete this account for good?", body: `<p class="hint">Their account, profile, photos and homes are deleted and can't be restored. Type their email to confirm.</p>`, fields: [{ name: "email", label: "Email", required: true, placeholder: a.email }, { name: "reason", label: "Reason", required: true }], confirm: "Delete for good", danger: true });
      if (!r) return;
      if (r.email.trim().toLowerCase() !== String(a.email).toLowerCase()) return toast("That email doesn't match. Nothing was deleted.");
      try { await api("DELETE", `/api/admin/accounts/${enc(id)}?reason=${enc(r.reason)}`); toast("Deleted"); closeDrawer(); VIEWS[view](); } catch (er) { toast(er.message); }
    });
    el.querySelectorAll("[data-chat]").forEach((b) => (b.onclick = () => openChat(b.dataset.chat, b.dataset.legacy ? id : null)));
  }

  // Homes
  let homeStatus = "pending", homeQuery = "";
  const SERVER_STATUS = new Set(["pending", "visible", "rejected", "hidden", "all"]);
  VIEWS.listings = async () => {
    $("#main").innerHTML = `${page("Home review", "Every new home is checked by a person before it goes live. Homes expire 60 days after posting unless pinned. When 3 different people report a home, it's hidden until you decide.", `<input class="input" id="q" placeholder="Search title, poster or area" value="${esc(homeQuery)}">`)}
      <div class="chips">${[["pending", "Waiting"], ["visible", "Live"], ["pinned", "Pinned"], ["auto_hidden", "Hidden by reports"], ["rejected", "Not approved"], ["hidden", "Taken down"], ["expired", "Expired"], ["all", "All"]].map(([k, l]) => `<button class="chip ${k === homeStatus ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
      <div class="card tablewrap" id="tbl"><div class="empty">Loading…</div></div>`;
    $("#main").querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { homeStatus = b.dataset.f; VIEWS.listings(); }));
    let timer;
    $("#q").oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => { homeQuery = e.target.value; load(); }, 250); };
    const review = can("listings.review");
    const pin = can("listings.pin");
    async function load() {
      const { listings = [] } = await api("GET", `/api/admin/listings?q=${enc(homeQuery)}&status=${SERVER_STATUS.has(homeStatus) ? homeStatus : "all"}`);
      const rows = listings.map((l) => ({ l, h: homeInfo(l) })).filter(({ h }) => ("all" === homeStatus ? true : "pinned" === homeStatus ? h.pinned : "expired" === homeStatus ? h.expired : h.status === homeStatus));
      $("#tbl").innerHTML = rows.length
        ? `<table><thead><tr><th>Home</th><th>Posted by</th><th>Price</th><th>Status</th><th>Pin & expiry</th><th></th></tr></thead><tbody>${rows
            .map(({ l, h }) => `<tr data-id="${esc(l.id)}"><td><b>${esc(txt(l.title) || "(no title)")}</b><span class="sub">${esc([l.district, txt(l.area)].filter(Boolean).join(" · "))} · ${plural(count(l.photos), "photo")} · posted ${day(l.postedAt || l.createdAt || l.updatedAt)}</span></td><td>${esc(l.email || l.hostName || "")}<span class="sub">${esc({ landlord: "Landlord", agent: "Agent", sublet: "Sublet" }[l.poster || l.hostKind] || l.poster || "")}${l.test ? ` · <span class="tag blue">Test</span>` : ""}</span></td><td>${priceText(l)}</td><td>${statusTag(h)}${h.reports ? `<span class="sub">${plural(h.reports, "report")}</span>` : ""}${h.note ? `<span class="sub">${esc(h.note)}</span>` : ""}</td><td>${h.pinned ? `<span class="tag blue">${pinText(h)}</span>` : `<span class="hint">${pinText(h)}</span>`}<span class="sub">${expiryText(h)}</span></td><td><div class="row">${
              review ? ("pending" === h.status ? `<button class="btn small primary" data-approve>Approve</button><button class="btn small" data-reject>Reject</button>`
                : "auto_hidden" === h.status ? `<button class="btn small primary" data-show>Restore</button><button class="btn small" data-hide>Keep hidden</button>`
                : "visible" === h.status ? `<button class="btn small" data-hide>Take down</button>` : `<button class="btn small" data-show>Put live</button>`) : ""}${
              pin ? (h.pinnedUntil ? `<button class="btn small" data-unpin>Unpin</button>` : h.pinned ? "" : `<button class="btn small" data-pin>Pin free</button>`) : ""}${
              review ? `<button class="btn small danger" data-del>Delete</button>` : ""}</div></td></tr>`)
            .join("")}</tbody></table>`
        : `<div class="empty">No homes here.</div>`;
      $("#tbl").querySelectorAll("tr[data-id]").forEach((tr) => {
        const id = tr.dataset.id;
        const on = (sel, fn) => { const b = tr.querySelector(sel); if (b) b.onclick = fn; };
        const post = async (body, msg) => { try { await api("POST", `/api/admin/listings/${enc(id)}`, body); toast(msg); load(); refreshCounts(); } catch (e) { toast(e.message); } };
        on("[data-approve]", () => post({ status: "visible", note: "" }, "Approved. The poster has been told."));
        on("[data-reject]", async () => {
          const r = await dialog({ title: "Reject this home?", body: `<p class="hint">The poster gets your reason and can fix it and send it again. If they paid for a pin, it's refunded.</p>`, fields: [{ name: "note", label: "Reason (the poster sees this)", required: true, placeholder: "e.g. fewer than 3 real photos, price looks wrong, no move-in date" }], confirm: "Reject" });
          if (r) post({ status: "rejected", note: r.note, reason: r.note }, "Rejected. The poster has been told.");
        });
        on("[data-hide]", async () => {
          const r = await dialog({ title: "Take this home down?", body: `<p class="hint">Nobody else will see it; the poster is told why. You can put it live again anytime.</p>`, fields: [{ name: "note", label: "Reason (the poster sees this)", required: true, placeholder: "e.g. looks like a scam, photos don't match, already rented" }], confirm: "Take down" });
          if (r) post({ status: "hidden", note: r.note, reason: r.note }, "Taken down");
        });
        on("[data-show]", () => post({ status: "visible", note: "", restore: true }, "Live again"));
        on("[data-pin]", async () => {
          const r = await dialog({ title: "Pin this home for free", body: `<p class="hint">Pinned homes show before the others and don't expire while pinned. No payment is taken.</p>`, fields: [{ name: "days", label: "Days", type: "number", required: true, value: "30" }], confirm: "Pin" });
          if (!r) return;
          const days = Number(r.days);
          if (!(days > 0)) return toast("Enter a number of days");
          try { await api("POST", `/api/admin/listings/${enc(id)}/pin`, { days }); toast(`Pinned for ${plural(days, "day")}`); load(); } catch (e) { toast(e.message); }
        });
        on("[data-unpin]", async () => {
          if (!(await dialog({ title: "Unpin this home?", body: `<p class="hint">It goes back to the normal order. Its 60-day expiry counts again.</p>`, confirm: "Unpin" }))) return;
          try { await api("DELETE", `/api/admin/listings/${enc(id)}/pin`); toast("Unpinned"); load(); } catch (e) { toast(e.message); }
        });
        on("[data-del]", async () => {
          const r = await dialog({ title: "Delete this home?", body: `<p class="hint">It's removed from the poster's account and can't be restored.</p>`, fields: [{ name: "reason", label: "Reason", required: true }], confirm: "Delete", danger: true });
          if (!r) return;
          try { await api("DELETE", `/api/admin/listings/${enc(id)}?reason=${enc(r.reason)}`); toast("Deleted"); load(); refreshCounts(); } catch (e) { toast(e.message); }
        });
      });
    }
    await load();
  };

  // Chats: threads (direct / home inquiry / team) with their members. Older servers sent per-account conversations.
  function normThread(c, people = {}) {
    const members = (c.members || []).map((m) => (typeof m === "string" ? { id: m, ...(people[m] || {}) } : m));
    return {
      id: c.id, legacy: Boolean(c.accountId && !String(c.id).startsWith("th_")), accountId: c.accountId,
      kind: c.kind || c.type || "direct", title: txt(c.title) || txt(c.listingTitle) || txt(c.teamName) || "",
      members, count: count(c.messages ?? c.messageCount), last: c.lastAt ?? c.last ?? null, status: c.status || "active", owner: txt(c.owner), email: c.email,
    };
  }

      const a = list[tr.dataset.i];
      const id = a.id || a.accountId;
      const decide = async (approve) => {
        const idOk = "green" === idState(a)[1];
        const r2 = await dialog({
          title: approve ? `Approve ${a.fullName || "this agent"}?` : `Reject ${a.fullName || "this application"}?`,
          body: approve ? `<p class="hint">They get the licensed agent badge and can buy an agent plan to post homes.</p>${idOk ? "" : `<div class="notice">Their Stripe ID check isn't complete.</div>`}` : `<p class="hint">They're told with your note and can apply again.</p>`,
          fields: [{ name: "note", label: approve ? "Note (optional)" : "Reason (the agent sees this)", type: "textarea", required: !approve, placeholder: approve ? "e.g. RECO registration checked" : "e.g. RECO number doesn't match the name" }],
          confirm: approve ? "Approve" : "Reject",
          danger: !approve,
        });
        if (!r2) return;
        try { await api("POST", `/api/admin/agents/${enc(id)}/decision`, { approve, note: r2.note }); toast(approve ? "Approved. The agent has been told." : "Rejected. The agent has been told."); VIEWS.agents(); refreshCounts(); } catch (e) { toast(e.message); }
      };
      const on = (sel, fn) => { const b = tr.querySelector(sel); if (b) b.onclick = fn; };
      on("[data-yes]", () => decide(true));
      on("[data-no]", () => decide(false));
      on("[data-open]", () => openAccount(a.accountId));
      on("[data-copy]", (e) => { e.preventDefault(); navigator.clipboard?.writeText(a.reco).then(() => toast("RECO number copied"), () => toast(a.reco)); });
    });
  };

  // Landlord applications: landlord mode is for approved hosts. Answer within 48 hours (the app promises it).
  let landlordStatus = "pending";
  const RELATION = { owner: "Owner", sublet: "Tenant subletting a room", manager: "Property manager" };
  const DUE = 48 * 3600000;
  const dueText = (a) => {
    const left = (a.createdAt ?? a.at) + DUE - Date.now();
    if (left <= 0) return ["Overdue", "red"];
    const h = Math.ceil(left / 3600000);
    return [`${h} h left`, h <= 12 ? "amber" : ""];
  };
  VIEWS.landlords = async () => {
    $("#main").innerHTML = `${page("Landlord applications", "Renters apply to switch on landlord mode. Check who they are and how they're connected to the home (owner, tenant with the landlord's consent, or property manager), then approve to unlock landlord mode. The app tells them we answer within 48 hours.")}
      <div class="chips">${[["pending", "Waiting"], ["approved", "Approved"], ["rejected", "Rejected"], ["all", "All"]].map(([k, l]) => `<button class="chip ${k === landlordStatus ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
      <div class="card tablewrap" id="tbl"><div class="empty">Loading…</div></div>`;
    $("#main").querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { landlordStatus = b.dataset.f; VIEWS.landlords(); }));
    const r = await api("GET", "/api/admin/landlords");
    const list = (r.applications || []).filter((a) => "all" === landlordStatus || (a.status || "pending") === landlordStatus);
    $("#tbl").innerHTML = list.length
      ? `<table><thead><tr><th>Applicant</th><th>Connection</th><th>Where</th><th>Identity</th><th>Applied</th><th>Status</th><th></th></tr></thead><tbody>${list
          .map((a, i) => {
            const [idText, idTone] = idState(a);
            const st = a.status || "pending";
            const [due, dueTone] = dueText(a);
            return `<tr data-i="${i}"><td><b>${esc(a.fullName || "(no name)")}</b><span class="sub">${esc(a.email || a.accountId || "")}${a.phone ? ` · ${esc(a.phone)}` : ""}</span></td><td>${esc(RELATION[a.relation] || a.relation || "—")}<span class="sub">${plural(a.homes || 1, "home")}</span></td><td>${esc(a.area || "—")}${a.about ? `<span class="sub">${esc(a.about)}</span>` : ""}</td><td><span class="tag ${idTone}">${idText}</span>${a.phoneVerified ? `<span class="sub">Phone verified</span>` : ""}</td><td>${fmt(a.createdAt ?? a.at)}${"pending" === st ? `<span class="sub"><span class="tag ${dueTone}">${due}</span></span>` : ""}</td><td><span class="tag ${ASTAT[st]?.[1] || ""}">${ASTAT[st]?.[0] || esc(st)}</span>${a.note ? `<span class="sub">${esc(a.note)}</span>` : ""}</td><td><div class="row">${"approved" !== st ? `<button class="btn small primary" data-yes>Approve</button>` : ""}${"rejected" !== st ? `<button class="btn small" data-no>Reject</button>` : ""}${a.accountId && can("users.read") ? `<button class="btn small ghost" data-open>Account</button>` : ""}</div></td></tr>`;
          })
          .join("")}</tbody></table>`
      : `<div class="empty">No ${"all" === landlordStatus ? "" : (ASTAT[landlordStatus]?.[0] || "").toLowerCase() + " "}applications.</div>`;
    $("#tbl").querySelectorAll("tr[data-i]").forEach((tr) => {
      const a = list[tr.dataset.i];
      const decide = async (approve) => {
        const r2 = await dialog({
          title: approve ? `Approve ${a.fullName || "this landlord"}?` : `Reject ${a.fullName || "this application"}?`,
          body: approve ? `<p class="hint">They can switch to landlord mode right away and get the landlord badge.</p>` : `<p class="hint">They're told with your note and can apply again.</p>`,
          fields: [{ name: "note", label: approve ? "Note (optional)" : "Reason (they see this)", type: "textarea", required: !approve, placeholder: approve ? "e.g. Ownership checked" : "e.g. Please add the address of the home you rent out" }],
          confirm: approve ? "Approve" : "Reject",
          danger: !approve,
        });
        if (!r2) return;
        try { await api("POST", `/api/admin/landlords/${enc(a.accountId)}/decision`, { approve, note: r2.note }); toast(approve ? "Approved. They've been told." : "Rejected. They've been told."); VIEWS.landlords(); refreshCounts(); } catch (e) { toast(e.message); }
      };
      const on = (sel, fn) => { const b = tr.querySelector(sel); if (b) b.onclick = fn; };
      on("[data-yes]", () => decide(true));
      on("[data-no]", () => decide(false));
      on("[data-open]", () => openAccount(a.accountId));
    });
  };

  // Audit log
  VIEWS.audit = async () => {
    loading();
    const { entries } = await api("GET", "/api/admin/audit?limit=300");
    $("#main").innerHTML = `${page("Audit log", "Every admin change and every chat opened: who, when and why")}
      <div class="card tablewrap">${entries.length ? `<table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th><th>Reason</th><th>Details</th></tr></thead><tbody>${entries.map((e) => `<tr><td>${fmt(e.at)}</td><td>${esc(e.admin || e.admin_id)}</td><td>${esc(ACTION[e.action] || e.action)}</td><td style="word-break:break-all">${esc(e.target || "—")}</td><td>${esc(e.reason || "—")}</td><td style="max-width:280px;word-break:break-all"><span class="sub">${esc(e.detail ? JSON.stringify(e.detail) : "")}</span></td></tr>`).join("")}</tbody></table>` : `<div class="empty">Nothing recorded yet.</div>`}</div>`;
  };

  fromEmailLink().then((handled) => {
    if (handled) return;
    if (TOKEN && API) start();
    else showSignin();
  });
})();
</script>
</body>
</html>
