<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ColivEase 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root {
  --ink: #0B2255; --ink-2: #33415C; --muted: #64748B; --line: #E3E8F1; --soft: #F4F7FC; --bg: #EEF2F8;
  --blue: #2865FF; --blue-soft: #EAF0FF; --green: #15803D; --green-soft: #DCFCE7; --red: #DC2626; --red-soft: #FEE2E2;
  --amber: #B45309; --amber-soft: #FEF3C7; --white: #fff;
  --font: Poppins, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
[hidden] { display: none !important; }

/* sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 20px 50px -30px rgba(11,34,85,.35); }
.signin .card { width: 100%; max-width: 420px; padding: 32px; display: grid; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.brand i { width: 34px; height: 34px; border-radius: 10px; background: var(--blue); display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 700; }
.signin h1 { margin: 0; font-size: 22px; }
.signin p { margin: 0; color: var(--muted); }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: 13px; }
.input, select.input, textarea.input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); outline: none; font-weight: 400; }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(40,101,255,.12); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--white); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: #1F55E8; color: #fff; }
.btn.danger { color: var(--red); border-color: #FCA5A5; }
.btn.danger:hover { background: var(--red); color: #fff; }
.btn.small { height: 30px; padding: 0 10px; border-radius: 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.error { color: var(--red); font-size: 13px; min-height: 1em; }

/* shell */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side { background: var(--ink); color: #C9D5F2; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.side .brand { color: #fff; padding: 4px 8px 18px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; border-radius: 10px; background: transparent; color: inherit; font-weight: 500; text-align: left; }
.nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav button.on { background: var(--blue); color: #fff; }
.nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 999px; background: #F59E0B; color: #111; font-size: 11px; font-weight: 700; text-align: center; }
.side .who { margin-top: auto; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.06); font-size: 12px; display: grid; gap: 6px; }
.side .who b { color: #fff; word-break: break-all; }
.side .who .btn { color: var(--ink); }
.main { padding: 26px 30px 60px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h2 { margin: 0; font-size: 24px; }
.head p { margin: 2px 0 0; color: var(--muted); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools .input { width: 260px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); font-size: 12.5px; font-weight: 500; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { padding: 16px; }
.stat small { color: var(--muted); font-weight: 500; }
.stat b { display: block; font-size: 26px; margin-top: 2px; }
.stat em { font-style: normal; font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.panel { padding: 18px; min-width: 0; }
.panel h3 { margin: 0 0 12px; font-size: 15px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 10px; }
.bars div { flex: 1; display: grid; align-content: end; justify-items: center; gap: 4px; height: 100%; font-size: 10px; color: var(--muted); }
.bars span { width: 100%; max-width: 26px; border-radius: 6px 6px 2px 2px; background: var(--blue); min-height: 2px; }

/* tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--soft); }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #F8FAFF; }
td .sub { display: block; color: var(--muted); font-size: 12px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* drawer + dialog */
.scrim { position: fixed; inset: 0; background: rgba(11,34,85,.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--white); z-index: 21; overflow-y: auto; padding: 24px; box-shadow: -20px 0 50px -20px rgba(11,34,85,.35); display: grid; align-content: start; gap: 18px; }
.drawer h3 { margin: 0; font-size: 20px; }
.drawer section { display: grid; gap: 10px; }
.drawer h4 { margin: 0; font-size: 13px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.toggle input { width: 18px; height: 18px; accent-color: var(--blue); }
.list { display: grid; gap: 6px; }
.list .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.dialog { position: fixed; z-index: 31; left: 50%; top: 50%; translate: -50% -50%; width: min(460px, calc(100vw - 32px)); padding: 22px; display: grid; gap: 14px; }
.dialog h3 { margin: 0; }
.close { position: absolute; top: 14px; right: 14px; }

/* chat transcript */
.msgs { display: grid; gap: 8px; }
.msg { max-width: 80%; padding: 9px 12px; border-radius: 14px; background: var(--soft); position: relative; }
.msg.me { justify-self: end; background: var(--blue-soft); }
.msg.system { justify-self: center; background: transparent; color: var(--muted); font-size: 12px; text-align: center; }
.msg small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.msg.can-del { padding-right: 52px; }
.msg .del { position: absolute; top: 6px; right: 6px; }
.notice { padding: 12px 14px; border-radius: 12px; background: var(--amber-soft); color: #78350F; font-size: 13px; }
.toast { position: fixed; bottom: 20px; left: 50%; translate: -50% 0; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 40; font-weight: 500; }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; }
  .side .brand, .side .who { display: none; }
  .nav { display: contents; }
  .nav button { width: auto; }
  .main { padding: 18px 16px 50px; }
  .grid2 { grid-template-columns: 1fr; }
  .tools .input { width: 100%; }
}
</style>
</head>
<body>

<div class="signin" id="signin" hidden>
  <form class="card" id="signin-form">
    <div class="brand"><i>E</i>ColivEase</div>
    <div><h1>管理后台</h1><p>用管理员邮箱登录。只有被授权的账号能进入，所有操作都会记录。</p></div>
    <details id="api-box"><summary class="hint" style="cursor:pointer">服务器设置</summary><label class="field" style="margin-top:8px">服务器地址<input class="input" id="api" placeholder="https://api.colivease.ca" required><span class="hint">ColivEase 后台服务的地址。本机测试用 http://localhost:8787</span></label></details>
    <label class="field">邮箱<input class="input" id="email" type="email" autocomplete="email" required></label>
    <div class="notice" id="sent-note" hidden></div>
    <label class="field" id="code-field" hidden>或输入邮件里的验证码<input class="input" id="code" inputmode="numeric" autocomplete="one-time-code"><span class="hint" id="code-hint"></span></label>
    <div class="error" id="signin-error"></div>
    <button class="btn primary" id="signin-go" type="submit">发送登录链接</button>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brand"><i>E</i>ColivEase 后台</div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span>已登录</span><b id="who-email"></b><span id="who-role" class="tag blue"></span><button class="btn small" id="signout">退出登录</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  const fmt = (ts) => (ts ? new Date(ts).toLocaleString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—");
  const ago = (ts) => {
    if (!ts) return "—";
    const m = Math.round((Date.now() - ts) / 6e4);
    return m < 1 ? "刚刚" : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`;
  };
  const LANG = { zh: "中文", en: "English", ko: "한국어", es: "Español", fr: "Français", hi: "हिन्दी", vi: "Tiếng Việt", tl: "Tagalog", fa: "فارسی", pt: "Português" };
  const KIND = { roommate: "室友", group: "群组", host: "房东/转租", landlord: "房东", realtor: "经纪" };
  const ROLE = { owner: "所有者", admin: "管理员", moderator: "审核员", support: "客服（只读）" };
  const ACTION = {
    "account.signout": "强制下线", "account.suspend": "封禁账号", "account.unsuspend": "解除封禁", "account.update": "修改账号", "account.plans": "修改会员/模式", "account.delete": "删除账号",
    "listing.update": "修改房源状态", "listing.approve": "通过房源", "listing.reject": "退回房源", "listing.delete": "删除房源", "chat.read": "查看聊天", "chat.message.delete": "删除消息", "report.update": "处理举报",
    "broadcast": "群发通知", "settings.update": "修改网站设置", "admin.set": "设置管理员", "admin.remove": "移除管理员",
  };

  const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
  // The ColivEase backend: the "api" Edge Function in ColivEase's own Supabase project (supabase/functions/api).
  const DEFAULT_API = LOCAL ? "http://localhost:8787" : "https://hwamygorfxbdpzaowomd.supabase.co/functions/v1";
  // The project's public anon key (safe in a web page; it only gets requests past Supabase's gateway — the function
  // checks the ColivEase session in x-cv-token). Filled in by scripts/web/assemble-admin.mjs.
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3YW15Z29yZnhiZHB6YW93b21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTY4NjEsImV4cCI6MjEwODI3Mjg2MX0.FW7PuZi3HY6nZhezMHE6VdWtPznYiZpWoQEZRZUWj-4";
  const savedApi = store.get("cv-admin-api");
  let API = savedApi && "https://api.colivease.ca" !== savedApi ? savedApi : DEFAULT_API;
  let TOKEN = store.get("cv-admin-token");
  let ME = null;
  let view = "overview";
  const can = (p) => ME?.permissions?.includes(p) || (p === "users.suspend" && ME?.permissions?.includes("users.write"));

  async function api(method, path, body) {
    const r = await fetch(API.replace(/\/$/, "") + path, {
      method,
      headers: API.includes(".supabase.co")
        ? { "content-type": "application/json", apikey: ANON_KEY, authorization: `Bearer ${ANON_KEY}`, ...(TOKEN ? { "x-cv-token": TOKEN } : {}) }
        : { "content-type": "application/json", ...(TOKEN ? { authorization: `Bearer ${TOKEN}` } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    }).catch(() => { throw new Error(API === DEFAULT_API && !LOCAL ? "暂时连不上 ColivEase 后台，请稍后再试" : "连不上服务器，检查「服务器设置」里的地址，或服务器是否在运行"); });
    const json = await r.json().catch(() => ({}));
    if (401 === r.status && TOKEN) { signOut(); throw new Error("登录已过期，请重新登录"); }
    if (!r.ok) throw new Error(json.error || `出错了（${r.status}）`);
    return json;
  }
  function toast(text) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  // ---- dialogs (the page builds its own: browser prompts are not used)
  function dialog({ title, body = "", fields = [], confirm = "确定", danger = false }) {
    return new Promise((resolve) => {
      const scrim = document.createElement("div");
      scrim.className = "scrim";
      scrim.style.zIndex = 30;
      const box = document.createElement("form");
      box.className = "card dialog";
      box.innerHTML = `<h3>${esc(title)}</h3>${body ? `<div>${body}</div>` : ""}${fields
        .map((f) => `<label class="field">${esc(f.label)}${f.type === "textarea" ? `<textarea class="input" name="${f.name}" rows="3" ${f.required ? "required" : ""} placeholder="${esc(f.placeholder || "")}">${esc(f.value || "")}</textarea>` : `<input class="input" name="${f.name}" ${f.required ? "required" : ""} ${f.minlength ? `minlength="${f.minlength}"` : ""} placeholder="${esc(f.placeholder || "")}" value="${esc(f.value || "")}">`}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</label>`)
        .join("")}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>取消</button><button class="btn ${danger ? "danger" : "primary"}">${esc(confirm)}</button></div>`;
      const done = (v) => { scrim.remove(); box.remove(); resolve(v); };
      scrim.onclick = () => done(null);
      box.querySelector("[data-x]").onclick = () => done(null);
      box.onsubmit = (e) => {
        e.preventDefault();
        done(Object.fromEntries(new FormData(box)));
      };
      document.body.append(scrim, box);
      (box.querySelector("input,textarea") || box.querySelector("button.primary,button.danger")).focus();
    });
  }
  function drawer(html) {
    closeDrawer();
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.id = "drawer-scrim";
    scrim.onclick = closeDrawer;
    const el = document.createElement("div");
    el.className = "drawer";
    el.id = "drawer";
    el.innerHTML = `<button class="btn small close" data-close>关闭</button>${html}`;
    el.querySelector("[data-close]").onclick = closeDrawer;
    document.body.append(scrim, el);
    return el;
  }
  function closeDrawer() {
    $("#drawer")?.remove();
    $("#drawer-scrim")?.remove();
  }
  addEventListener("keydown", (e) => e.key === "Escape" && closeDrawer());

  // ---- sign-in
  function showSignin() {
    $("#shell").hidden = true;
    $("#signin").hidden = false;
    $("#api").value = API;
    $("#api-box").open = API !== DEFAULT_API;
    $("#email").value = store.get("cv-admin-email") || "";
  }
  let codeSent = false;
  $("#signin-form").onsubmit = async (e) => {
    e.preventDefault();
    const err = $("#signin-error");
    err.textContent = "";
    API = $("#api").value.trim().replace(/\/$/, "");
    store.set("cv-admin-api", API);
    const email = $("#email").value.trim().toLowerCase();
    store.set("cv-admin-email", email);
    $("#signin-go").disabled = true;
    try {
      if (!codeSent) {
        const r = await api("POST", "/api/auth/start", { email, redirectTo: location.origin + location.pathname });
        codeSent = true;
        $("#sent-note").hidden = false;
        $("#sent-note").textContent = r.demo ? `本机测试模式：验证码 ${r.code}` : `登录邮件已发到 ${email}。点邮件里的「登录」链接就会回到这里并自动登录（链接 1 小时内有效）。`;
        $("#code-field").hidden = false;
        $("#signin-go").textContent = "用验证码登录";
      } else {
        await finishSignIn(await api("POST", "/api/auth/verify", { email, code: $("#code").value.trim() }));
      }
    } catch (e2) {
      err.textContent = e2.message;
    } finally {
      $("#signin-go").disabled = false;
    }
  };
  async function finishSignIn(r) {
    TOKEN = r.token;
    try {
      ME = await api("GET", "/api/admin/me");
    } catch (e2) {
      await api("POST", "/api/auth/logout").catch(() => {});
      TOKEN = null;
      ME = null;
      throw e2;
    }
    store.set("cv-admin-token", TOKEN);
    codeSent = false;
    $("#sent-note").hidden = true;
    $("#code-field").hidden = true;
    $("#code").value = "";
    $("#signin-go").textContent = "发送登录链接";
    start();
  }
  // Back from the sign-in link in the email: Supabase puts the token in the address (#access_token=…).
  async function fromEmailLink() {
    const params = new URLSearchParams(location.hash.slice(1));
    if (!params.get("access_token") && !params.get("error_description")) return false;
    history.replaceState(null, "", location.pathname);
    showSignin();
    if (params.get("error_description")) {
      $("#signin-error").textContent = `登录链接无效或已过期，请重新发送（${params.get("error_description")}）`;
      return true;
    }
    try {
      await finishSignIn(await api("POST", "/api/auth/exchange", { accessToken: params.get("access_token") }));
    } catch (e) {
      $("#signin-error").textContent = e.message;
    }
    return true;
  }

  function signOut() {
    if (TOKEN) api("POST", "/api/auth/logout").catch(() => {});
    TOKEN = null;
    ME = null;
    store.set("cv-admin-token", null);
    closeDrawer();
    showSignin();
  }
  $("#signout").onclick = signOut;

  // ---- shell
  const SECTIONS = [
    ["overview", "概览", null],
    ["accounts", "用户", "users.read"],
    ["listings", "房源审核", "listings.read"],
    ["chats", "聊天记录", "chats.read"],
    ["reports", "举报", "reports.read"],
    ["members", "会员", "users.read"],
    ["settings", "网站设置", null],
    ["broadcast", "群发通知", "broadcast"],
    ["admins", "管理员与权限", null],
    ["audit", "操作日志", "audit.read"],
  ];
  let openReports = 0;
  let pendingHomes = 0;
  function renderNav() {
    $("#nav").innerHTML = SECTIONS.filter(([, , p]) => !p || can(p))
      .map(([key, label]) => `<button data-view="${key}" class="${key === view ? "on" : ""}">${label}${key === "reports" && openReports ? `<span class="count">${openReports}</span>` : ""}${key === "listings" && pendingHomes ? `<span class="count">${pendingHomes}</span>` : ""}</button>`)
      .join("");
    $("#nav").querySelectorAll("button").forEach((b) => (b.onclick = () => go(b.dataset.view)));
  }
  function go(next) {
    view = next;
    closeDrawer();
    renderNav();
    store.set("cv-admin-view", next);

    try { c = await api("GET", `/api/admin/conversations/${encodeURIComponent(accountId)}/${encodeURIComponent(convId)}?reason=${encodeURIComponent(reason)}`); } catch (e) { return toast(e.message); }
    const el = drawer(`<div><h3>${esc(c.title)}</h3><p class="hint">${esc(c.email)} 的${KIND[c.type] || ""}聊天 · ${c.messages.length} 条 · 原因：${esc(reason)}</p></div>
      <div class="msgs">${c.messages.map((m) => `<div class="msg ${m.from === "me" ? "me" : m.from === "system" ? "system" : ""} ${can("chats.write") && m.from !== "system" ? "can-del" : ""}">${m.kind === "text" || m.kind === "system" ? esc(m.text) : `<i>[${esc(m.kind)}]</i> ${esc(m.text)}`}<small>${m.from === "me" ? "账号本人" : m.from === "system" ? "" : esc(m.from)} · ${fmt(m.ts)}</small>${can("chats.write") && m.from !== "system" ? `<button class="btn small danger del" data-m="${esc(m.id)}" title="删除这条消息">删</button>` : ""}</div>`).join("") || `<p class="hint">没有消息</p>`}</div>`);
    el.querySelectorAll("[data-m]").forEach((b) => (b.onclick = async () => {
      const r = await dialog({ title: "删除这条消息？", fields: [{ name: "reason", label: "原因", required: true }], confirm: "删除", danger: true });
      if (!r) return;
      try { await api("DELETE", `/api/admin/conversations/${encodeURIComponent(accountId)}/${encodeURIComponent(convId)}/messages/${encodeURIComponent(b.dataset.m)}?reason=${encodeURIComponent(r.reason)}`); toast("已删除"); openChat(accountId, convId, reason); } catch (e) { toast(e.message); }
    }));
  }

  // Reports
  let reportStatus = "open";
  const RSTAT = { open: ["待处理", "red"], reviewing: ["处理中", "amber"], resolved: ["已解决", "green"], dismissed: ["已驳回", ""] };
  VIEWS.reports = async () => {
    $("#main").innerHTML = `${page("举报", "用户提交的举报：处理、记录结果")}
      <div class="chips">${[["open", "待处理"], ["reviewing", "处理中"], ["resolved", "已解决"], ["dismissed", "已驳回"], ["all", "全部"]].map(([k, l]) => `<button class="chip ${k === reportStatus ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
      <div class="card tablewrap" id="tbl"><div class="empty">加载中…</div></div>`;
    $("#main").querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { reportStatus = b.dataset.f; VIEWS.reports(); }));
    const { reports } = await api("GET", `/api/admin/reports?status=${reportStatus}`);
    $("#tbl").innerHTML = reports.length
      ? `<table><thead><tr><th>举报人</th><th>被举报</th><th>原因</th><th>时间</th><th>状态</th><th></th></tr></thead><tbody>${reports
          .map((r) => `<tr data-id="${esc(r.id)}"><td><b>${esc(r.reporter.name || "")}</b><span class="sub">${esc(r.reporter.email)}</span></td><td>${esc(r.about.name)}</td><td><b>${esc(r.reason)}</b><span class="sub">${esc(r.details)}</span></td><td>${fmt(r.at)}</td><td><span class="tag ${RSTAT[r.status]?.[1] || ""}">${RSTAT[r.status]?.[0] || r.status}</span>${r.note ? `<span class="sub">${esc(r.note)}${r.handledBy ? ` · ${esc(r.handledBy)}` : ""}</span>` : ""}</td><td><div class="row"><button class="btn small" data-who="${esc(r.reporter.id)}">举报人</button>${can("reports.write") ? `<button class="btn small primary" data-handle>处理</button>` : ""}</div></td></tr>`)
          .join("")}</tbody></table>`
      : `<div class="empty">没有${reportStatus === "all" ? "" : RSTAT[reportStatus]?.[0] || ""}的举报</div>`;
    $("#tbl").querySelectorAll("[data-who]").forEach((b) => (b.onclick = () => openAccount(b.dataset.who)));
    $("#tbl").querySelectorAll("[data-handle]").forEach((b) => (b.onclick = async () => {
      const id = b.closest("tr").dataset.id;
      const r = await dialog({ title: "处理举报", body: `<label class="field">结果<select class="input" name="status"><option value="reviewing">处理中</option><option value="resolved">已解决</option><option value="dismissed">驳回</option><option value="open">重新打开</option></select></label>`, fields: [{ name: "note", label: "处理记录", type: "textarea", placeholder: "例如：已封禁对方 / 证据不足" }], confirm: "保存" });
      if (!r) return;
      try { await api("POST", `/api/admin/reports/${encodeURIComponent(id)}`, r); toast("已保存"); VIEWS.reports(); } catch (e) { toast(e.message); }
    }));
  };

  // Settings
  VIEWS.settings = async () => {
    loading();
    const s = await api("GET", "/api/admin/settings");
    const edit = can("settings.write");
    const a = s.announcement || {};
    $("#main").innerHTML = `${page("网站设置", edit ? "改完点保存，网站和 app 会马上生效" : "你的角色只能查看")}
      <div class="grid2">
        <form class="card panel" id="ann" style="display:grid;gap:12px"><h3>顶部公告</h3>
          <label class="toggle"><input type="checkbox" name="active" ${a.active ? "checked" : ""} ${edit ? "" : "disabled"}>显示公告</label>
          <label class="field">样式<select class="input" name="tone" ${edit ? "" : "disabled"}><option value="info" ${a.tone === "info" ? "selected" : ""}>普通（蓝色）</option><option value="warning" ${a.tone === "warning" ? "selected" : ""}>提醒（黄色）</option><option value="danger" ${a.tone === "danger" ? "selected" : ""}>紧急（红色）</option></select></label>
          <label class="field">中文<textarea class="input" name="zh" rows="2" ${edit ? "" : "disabled"}>${esc(a.zh || "")}</textarea></label>
          <label class="field">English<textarea class="input" name="en" rows="2" ${edit ? "" : "disabled"}>${esc(a.en || "")}</textarea></label>
          ${edit ? `<div><button class="btn primary">保存公告</button></div>` : ""}
        </form>
        <form class="card panel" id="switches" style="display:grid;gap:14px"><h3>开关</h3>
          <label class="toggle"><input type="checkbox" name="listingApproval" ${s.listingApproval !== false ? "checked" : ""} ${edit ? "" : "disabled"}>新房源需要审核通过才公开</label>
          <label class="toggle"><input type="checkbox" name="signupsOpen" ${s.signupsOpen !== false ? "checked" : ""} ${edit ? "" : "disabled"}>开放新用户注册</label>
          <label class="toggle"><input type="checkbox" name="maintenance" ${s.maintenance ? "checked" : ""} ${edit ? "" : "disabled"}>维护模式（app 显示维护提示）</label>
          <label class="toggle"><input type="checkbox" name="safetyMembersOnly" ${s.safetyMembersOnly !== false ? "checked" : ""} ${edit ? "" : "disabled"}>治安数据只对会员开放</label>
          ${edit ? `<div><button class="btn primary">保存开关</button></div>` : ""}
        </form>
      </div>`;
    if (!edit) return;
    $("#ann").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try { await api("PUT", "/api/admin/settings", { announcement: { active: f.get("active") === "on", tone: f.get("tone"), zh: f.get("zh").trim(), en: f.get("en").trim() } }); toast("公告已保存"); } catch (er) { toast(er.message); }
    };
    $("#switches").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try { await api("PUT", "/api/admin/settings", { listingApproval: f.get("listingApproval") === "on", signupsOpen: f.get("signupsOpen") === "on", maintenance: f.get("maintenance") === "on", safetyMembersOnly: f.get("safetyMembersOnly") === "on" }); toast("开关已保存"); } catch (er) { toast(er.message); }
    };
  };

  // Broadcast
  VIEWS.broadcast = async () => {
    $("#main").innerHTML = `${page("群发通知", "发一条通知到每个用户的「通知」里")}
      <form class="card panel" id="bc" style="display:grid;gap:12px;max-width:620px">
        <label class="field">标题<input class="input" name="title" required maxlength="120"></label>
        <label class="field">内容<textarea class="input" name="body" rows="4" maxlength="600"></textarea></label>
        <div><button class="btn primary">发送给所有人</button></div>
      </form>`;
    $("#bc").onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const ok = await dialog({ title: "发送给所有用户？", body: `<p><b>${esc(f.title)}</b></p><p class="hint">${esc(f.body)}</p>`, confirm: "发送" });
      if (!ok) return;
      try { const r = await api("POST", "/api/admin/broadcast", f); toast(`已发送给 ${r.sent} 个账号`); e.target.reset(); } catch (er) { toast(er.message); }
    };
  };

  // Admins
  const PERMS = [["users.read", "查看用户"], ["users.suspend", "封禁用户"], ["users.write", "修改用户"], ["users.delete", "删除用户"], ["listings.read", "查看房源"], ["listings.write", "管理房源"], ["chats.read", "查看聊天"], ["chats.write", "删除消息"], ["reports.write", "处理举报"], ["plans.write", "管理会员"], ["settings.write", "网站设置"], ["broadcast", "群发通知"], ["admins.write", "管理管理员"], ["audit.read", "操作日志"]];
  VIEWS.admins = async () => {
    loading();
    const { admins, roles } = await api("GET", "/api/admin/admins");
    const has = (role, p) => roles[role].includes(p) || (p === "users.suspend" && roles[role].includes("users.write"));
    $("#main").innerHTML = `${page("管理员与权限", "谁能进后台、能做什么")}
      <div class="grid2">
        <div class="card panel"><h3>管理员</h3><div class="list">${admins.map((a) => `<div class="item"><div><b>${esc(a.email)}</b><span class="sub" style="display:block;color:var(--muted);font-size:12px">${a.fixed ? "服务器设置的所有者（ADMIN_EMAILS）" : `由 ${esc(a.addedBy || "—")} 添加`}</span></div><div class="row"><span class="tag amber">${ROLE[a.role] || a.role}</span>${!a.fixed && can("admins.write") ? `<button class="btn small danger" data-rm="${esc(a.accountId)}">移除</button>` : ""}</div></div>`).join("")}</div>
          ${can("admins.write") ? `<form id="add" class="row" style="margin-top:14px"><input class="input" name="email" type="email" required placeholder="对方的 ColivEase 登录邮箱" style="flex:1;min-width:200px"><select class="input" name="role" style="width:auto"><option value="admin">管理员</option><option value="moderator">审核员</option><option value="support">客服（只读）</option></select><button class="btn primary">添加</button></form><p class="hint">对方需要先用这个邮箱登录过一次 ColivEase。</p>` : ""}
        </div>
        <div class="card panel tablewrap"><h3>角色权限</h3><table class="matrix"><thead><tr><th>权限</th>${Object.keys(roles).map((r) => `<th>${ROLE[r]}</th>`).join("")}</tr></thead><tbody>${PERMS.map(([p, l]) => `<tr><td>${l}</td>${Object.keys(roles).map((r) => `<td>${has(r, p) ? "✓" : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      </div>`;
    $("#add") && ($("#add").onsubmit = async (e) => {
      e.preventDefault();
      try { await api("PUT", "/api/admin/admins", Object.fromEntries(new FormData(e.target))); toast("已添加"); VIEWS.admins(); } catch (er) { toast(er.message); }
    });
    $("#main").querySelectorAll("[data-rm]").forEach((b) => (b.onclick = async () => {
      if (!(await dialog({ title: "移除这个管理员？", confirm: "移除", danger: true }))) return;
      try { await api("DELETE", `/api/admin/admins/${encodeURIComponent(b.dataset.rm)}`); toast("已移除"); VIEWS.admins(); } catch (er) { toast(er.message); }
    }));
  };

  // Audit log
  VIEWS.audit = async () => {
    loading();
    const { entries } = await api("GET", "/api/admin/audit?limit=300");
    $("#main").innerHTML = `${page("操作日志", "每一次后台修改和查看聊天，谁、什么时候、为什么")}
      <div class="card tablewrap">${entries.length ? `<table><thead><tr><th>时间</th><th>管理员</th><th>操作</th><th>对象</th><th>原因</th><th>详情</th></tr></thead><tbody>${entries.map((e) => `<tr><td>${fmt(e.at)}</td><td>${esc(e.admin || e.admin_id)}</td><td>${esc(ACTION[e.action] || e.action)}</td><td style="word-break:break-all">${esc(e.target || "—")}</td><td>${esc(e.reason || "—")}</td><td style="max-width:280px;word-break:break-all"><span class="sub">${esc(e.detail ? JSON.stringify(e.detail) : "")}</span></td></tr>`).join("")}</tbody></table>` : `<div class="empty">还没有记录</div>`}</div>`;
  };

  fromEmailLink().then((handled) => {
    if (handled) return;
    if (TOKEN && API) start();
    else showSignin();
  });
})();
</script>
</body>
</html>
