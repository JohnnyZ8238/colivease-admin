<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ColivEase Admin</title>
<link rel="icon" href="icon-192.png">
<!-- Hidden until the script below has made sure the panel isn't inside a frame (GitHub Pages can't send frame headers). -->
<style id="antiframe">html { display: none !important; }</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* The ColivEase look (same as www.colivease.ca): grid paper, glass cards, Fredoka headings, Poppins text, ColivEase
   blue on navy ink, pill buttons. */
:root {
  --ink: #0B2255; --ink-2: #33415C; --muted: #64748B; --faint: #94A3B8; --line: #E2E8F0; --soft: #F1F5FF; --bg: #F5F7FB;
  --blue: #2865FF; --blue-2: #4F83FF; --blue-deep: #1A4FE0; --blue-soft: #E7EFFE;
  --green: #15803D; --green-soft: #DCFCE7; --red: #DC2626; --red-soft: #FEE2E2; --amber: #B45309; --amber-soft: #FEF3C7;
  --glass: rgba(255,255,255,.86); --white: #fff;
  --display: Fredoka, "Poppins", system-ui, sans-serif; --body: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 2px rgba(11,34,85,.04), 0 18px 40px -26px rgba(11,34,85,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(rgba(40,101,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(40,101,255,.05) 1px, transparent 1px); background-size: 44px 44px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.2px; }

/* brand */
.brand { display: flex; align-items: center; gap: 10px; font: 700 20px var(--display); color: var(--ink); }
.mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue-2), var(--blue-deep)); color: #fff; font: 700 21px var(--display); box-shadow: 0 8px 18px -8px rgba(40,101,255,.8); }
.brand small { font: 600 11px var(--body); color: var(--blue); background: var(--blue-soft); padding: 2px 8px; border-radius: 999px; }
.brand img { height: 46px; width: auto; display: block; }
.side .brand img { height: 52px; }

/* sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.card { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(226,232,240,.9); border-radius: 22px; box-shadow: var(--shadow); }
.signin .card { width: 100%; max-width: 430px; padding: 32px; display: grid; gap: 16px; }
.signin h1 { margin: 6px 0 0; font-size: 30px; }
.signin p { margin: 0; color: var(--muted); }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: 13px; color: var(--ink); }
.input, select.input, textarea.input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--white); outline: none; font-weight: 400; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(40,101,255,.12); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
details summary { cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font: 600 13px var(--body); white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s, transform .1s; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 10px 22px -12px rgba(40,101,255,.9); }
.btn.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue); }
.btn.ghost:hover { background: var(--blue-soft); }
.btn.danger { color: var(--red); border-color: #FCA5A5; }
.btn.danger:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { height: 32px; padding: 0 12px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.error { color: var(--red); font-size: 13px; min-height: 1em; }
.notice { padding: 12px 14px; border-radius: 14px; background: var(--amber-soft); color: #78350F; font-size: 13px; }
.notice.blue { background: var(--blue-soft); color: var(--ink); }

/* shell */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.side { padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-right: 1px solid var(--line); }
.side .brand { padding: 4px 8px 20px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-weight: 500; text-align: left; transition: background-color .15s, color .15s; }
.nav button:hover { background: var(--soft); color: var(--ink); }
.nav button.on { background: var(--blue); color: #fff; box-shadow: 0 10px 20px -12px rgba(40,101,255,.9); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; background: #F59E0B; color: #111; font-size: 11px; font-weight: 700; text-align: center; line-height: 20px; }
.side .who { margin-top: auto; padding: 14px; border-radius: 18px; background: var(--white); border: 1px solid var(--line); font-size: 12px; display: grid; gap: 8px; }
.side .who b { color: var(--ink); word-break: break-all; font-size: 13px; }
.side .who .row { gap: 6px; }
.main { padding: 28px 34px 64px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h2 { margin: 0; font-size: 30px; }
.head p { margin: 2px 0 0; color: var(--muted); max-width: 70ch; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools .input { width: 280px; border-radius: 999px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { padding: 18px; }
.stat small { color: var(--muted); font-weight: 500; }
.stat b { display: block; font: 700 30px var(--display); margin-top: 2px; color: var(--ink); }
.stat em { font-style: normal; font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.panel { padding: 20px; min-width: 0; }
.panel h3 { margin: 0 0 12px; font-size: 18px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
.bars div { flex: 1; display: grid; align-content: end; justify-items: center; gap: 4px; height: 100%; font-size: 10px; color: var(--muted); }
.bars span { width: 100%; max-width: 26px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--blue-2), var(--blue)); min-height: 3px; }

/* tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: rgba(231,239,254,.45); }
td .sub, .item .sub { display: block; color: var(--muted); font-size: 12px; }
.empty { padding: 44px; text-align: center; color: var(--muted); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* drawer + dialog */
.scrim { position: fixed; inset: 0; background: rgba(11,34,85,.32); backdrop-filter: blur(3px); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--white); z-index: 21; overflow-y: auto; padding: 26px; box-shadow: -24px 0 60px -24px rgba(11,34,85,.4); display: grid; align-content: start; gap: 20px; border-radius: 24px 0 0 24px; }
.drawer h3 { margin: 0; font-size: 24px; }
.drawer section { display: grid; gap: 10px; }
.drawer h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.toggle input { width: 18px; height: 18px; accent-color: var(--blue); }
.list { display: grid; gap: 8px; }
.list .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); }
.dialog { position: fixed; z-index: 31; left: 50%; top: 50%; translate: -50% -50%; width: min(470px, calc(100vw - 32px)); padding: 24px; display: grid; gap: 14px; background: var(--white); }
.dialog h3 { margin: 0; font-size: 22px; }
.close { position: absolute; top: 16px; right: 16px; }

/* chat transcript */
.msgs { display: grid; gap: 8px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; background: var(--soft); position: relative; }
.msg.me { justify-self: end; background: var(--blue); color: #fff; }
.msg.me small { color: rgba(255,255,255,.8); }
.msg.system { justify-self: center; background: transparent; color: var(--muted); font-size: 12px; text-align: center; }
.msg small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.msg.can-del { padding-right: 56px; }
.msg.deleted { opacity: .55; }
.msg.deleted .body { text-decoration: line-through; }
.msg .del { position: absolute; top: 6px; right: 6px; }
.toast { position: fixed; bottom: 22px; left: 50%; translate: -50% 0; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; z-index: 40; font-weight: 500; box-shadow: var(--shadow); }
.matrix td, .matrix th { text-align: center; }
.tabs { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--soft); gap: 2px; }
.tabs button { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button.on { background: var(--white); color: var(--ink); box-shadow: 0 2px 8px rgba(11,34,85,.12); }
.channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
.channel { padding: 18px; display: grid; gap: 8px; align-content: start; }
.channel h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: #22C55E; box-shadow: 0 0 0 4px rgba(34,197,94,.15); }
.dot.off { background: #F59E0B; box-shadow: 0 0 0 4px rgba(245,158,11,.15); }
.cat { margin: 18px 0 8px; font: 700 15px var(--display); color: var(--ink); }
.tpl { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tpl:last-child { border-bottom: 0; }
.tpl:hover { background: rgba(231,239,254,.45); }
.tpl .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl > div:first-child { min-width: 0; }
.vars { display: flex; flex-wrap: wrap; gap: 6px; }
.var { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px dashed #A7C1FF; background: var(--blue-soft); color: var(--blue); font: 600 12px var(--body); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preview { width: 100%; height: 560px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); }
.pushcard { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); }
.pushcard .mark { width: 34px; height: 34px; font-size: 18px; border-radius: 10px; }
@media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
/* staff permissions, grants */
.perms { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px 20px; }
.perms fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; align-content: start; }
.perms legend { font: 600 12px var(--body); color: var(--muted); letter-spacing: .3px; padding: 0; margin-bottom: 4px; }
.perms .toggle { font-size: 13px; }
.staff { padding: 20px; display: grid; gap: 14px; margin-bottom: 14px; }
.staff-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.input.sm { height: 34px; padding: 0 10px; width: auto; border-radius: 12px; }
.input.num { width: 84px; }
.grant { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; }
.grant b { font-size: 13px; }
/* selection + bulk actions */
td.sel, th.sel { width: 36px; padding-right: 0; }
td.sel input, th.sel input { width: 17px; height: 17px; accent-color: var(--blue); }
.bulkbar { position: sticky; top: 8px; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 14px; margin-bottom: 12px; border-radius: 18px; background: var(--ink); color: #fff; box-shadow: var(--shadow); }
.bulkbar b { margin-right: 6px; }
.bulkbar .btn { height: 32px; padding: 0 12px; font-size: 12px; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }
.bulkbar .btn:hover { background: #fff; color: var(--ink); }
.bulkbar .btn.danger { border-color: #FCA5A5; color: #FECACA; }
.bulkbar .btn.danger:hover { background: var(--red); color: #fff; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick label { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font-size: 12.5px; font-weight: 500; cursor: pointer; }
.pick input { accent-color: var(--blue); }
.pick label:has(input:checked) { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px; align-items: end; }
/* multi-session console */
.console { position: fixed; inset: 0; z-index: 25; background: #0B1530; display: grid; grid-template-rows: auto 1fr; }
.console-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--ink); color: #fff; }
.console-head h3 { margin: 0 8px 0 0; font-size: 18px; color: #fff; }
.console-head .btn { height: 32px; font-size: 12px; color: var(--ink); }
.console-head .btn.primary { color: #fff; }
.console-head .btn.danger { color: var(--red); }
.console-head select { height: 32px; border-radius: 10px; border: 0; padding: 0 8px; }
.console-grid { overflow: auto; display: grid; gap: 10px; padding: 10px; grid-template-columns: repeat(var(--cols, 3), minmax(300px, 1fr)); grid-auto-rows: minmax(560px, calc(100vh - 90px)); }
.console-cell { display: grid; grid-template-rows: auto 1fr; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); min-width: 0; }
.console-cell header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #FEF3C7; border-bottom: 1px solid #F59E0B; font-size: 12px; min-width: 0; }
.console-cell header b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.console-cell header .sp { flex: none; }
.console-cell header .sp { margin-left: auto; display: flex; gap: 4px; }
.console-cell header .btn { height: 26px; padding: 0 9px; font-size: 11px; }
.console-cell iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
.console-tabs { padding: 16px; color: #fff; overflow: auto; }
.console-tabs .list .item { background: #fff; color: var(--ink); }
@media (max-width: 700px) { .console-grid { grid-template-columns: 1fr; } }
/* stress test */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.kpi { padding: 14px; }
.kpi small { color: var(--muted); font-weight: 500; }
.kpi b { display: block; font: 700 24px var(--display); }
.spark { width: 100%; height: 120px; display: block; }
.spark .grid { stroke: var(--line); stroke-width: 1; }
.spark .rps { fill: none; stroke: var(--blue); stroke-width: 2; }
.spark .p95 { fill: none; stroke: #F59E0B; stroke-width: 2; }
.spark .err { fill: var(--red); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
/* support messages */
.inbox { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 14px; min-height: 560px; }
.inbox .threads { overflow: auto; max-height: calc(100vh - 220px); padding: 8px; }
.inbox .thread { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 10px 12px; border-radius: 14px; cursor: pointer; }
.inbox .thread:hover { background: var(--soft); }
.inbox .thread.on { background: var(--blue-soft); }
.inbox .thread .sub { grid-column: 1 / -1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox .conv { display: grid; grid-template-rows: auto 1fr auto; min-height: 560px; max-height: calc(100vh - 160px); padding: 16px; gap: 12px; }
.inbox .conv .msgs { overflow: auto; align-content: start; padding-right: 4px; }
.inbox .reply { display: flex; gap: 8px; align-items: flex-end; }
.inbox .reply textarea { flex: 1; resize: vertical; min-height: 44px; }
@media (max-width: 900px) { .inbox { grid-template-columns: 1fr; } }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .brand, .side .who { display: none; }
  .nav { display: contents; }
  .nav button { width: auto; }
  .main { padding: 18px 16px 50px; }
  .grid2 { grid-template-columns: 1fr; }
  .tools .input { width: 100%; }
  .drawer { border-radius: 0; }
}
</style>
</head>
<body>

<div class="signin" id="signin" hidden>
  <form class="card" id="signin-form">
    <div class="brand"><img src="logo.png" alt="ColivEase"><small>Admin</small></div>
    <div><h1>Sign in</h1><p>Admins only. Every action is recorded.</p></div>
    <label class="field">Email<input class="input" id="email" type="email" autocomplete="username" required></label>
    <label class="field" id="pw-field">Password<input class="input" id="password" type="password" autocomplete="current-password"></label>
    <div class="notice blue" id="sent-note" hidden></div>
    <label class="field" id="code-field" hidden>Or enter the code from the email<input class="input" id="code" inputmode="numeric" autocomplete="one-time-code"></label>
    <div class="error" id="signin-error"></div>
    <button class="btn primary" id="signin-go" type="submit">Sign in</button>
    <button class="btn ghost" id="link-go" type="button">First time, or forgot your password? Email me a sign-in link</button>
    <details id="api-box"><summary class="hint">Server</summary><label class="field" style="margin-top:8px">Server address<input class="input" id="api" required><span class="hint">The ColivEase backend. For local testing: http://localhost:8787</span></label></details>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brand"><img src="logo.png" alt="ColivEase"><small>Admin</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span class="hint">Signed in as</span><b id="who-email"></b><span id="who-role" class="tag blue" style="justify-self:start"></span><div class="row"><button class="btn small" id="setpw">Password</button><button class="btn small" id="signout">Sign out</button></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
(() => {
  "use strict";
  // Never inside a frame (clickjacking): the page stays hidden (the style in <head>) and tries to take over the window.

  // Homes: review state, pin and the 60-day expiry, worked out the same way everywhere in the panel.

  const HSTAT = { pending: ["Waiting", "amber"], visible: ["Live", "green"], rejected: ["Not approved", "red"], hidden: ["Taken down", ""], auto_hidden: ["Hidden by reports", "red"], draft: ["Draft (not sent for review)", ""] };

  // Chats: threads (direct / home inquiry / team) with their members. Older servers sent per-account conversations.
  function normThread(c, people = {}) {
    const members = (c.members || []).map((m) => (typeof m === "string" ? { id: m, ...(people[m] || {}) } : m));
    return {
      id: c.id, legacy: Boolean(c.accountId && !String(c.id).startsWith("th_")), accountId: c.accountId,
      kind: c.kind || c.type || "direct", title: txt(c.title) || txt(c.listingTitle) || txt(c.teamName) || "",

    };

  const memberList = (t) => (t.members.length ? t.members.map((m) => `${esc(txt(m.name) || m.email || m.id)}${m.test ? " (test)" : ""}`).join(", ") : esc(t.owner || t.email || "—"));

  VIEWS.chats = async () => {
    $("#main").innerHTML = `${page("Chats", "Direct chats, home inquiries and team chats. The list shows members and counts only.", `<input class="input" id="q" placeholder="Search a person, email or home" value="${esc(chatQuery)}">`)}

      <div class="chips">${[["all", "All"], ["direct", "Direct"], ["listing", "Home inquiries"], ["team", "Teams"]].map(([k, l]) => `<button class="chip ${k === chatKind ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>

    $("#q").oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => { chatQuery = e.target.value; load(); }, 250); };

      const r = await api("GET", `/api/admin/conversations?q=${enc(chatQuery)}${"all" === chatKind ? "" : `&kind=${chatKind}`}`);
      const list = (r.threads || r.conversations || []).map((c) => normThread(c, r.people || {})).filter((t) => "all" === chatKind || t.kind === chatKind);

        : `<div class="empty">No chats yet.</div>`;
      $("#tbl").querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => openChat(b.dataset.c, b.dataset.a || null)));
    }
    await load();
  };
  async function openChat(threadId, accountId, reason) {
    if (!reason) {
      const r = await dialog({ title: "Open this chat", body: `<div class="notice">Opening a chat is recorded in the audit log.</div><p class="hint" style="margin-top:10px">Say why you need to read it.</p>`, fields: [{ name: "reason", label: "Reason", required: true, minlength: 4, placeholder: "e.g. reviewing a report / scam investigation" }], confirm: "Open" });
      if (!r) return;
      reason = r.reason;
    }
    const base = accountId ? `/api/admin/conversations/${enc(accountId)}/${enc(threadId)}` : `/api/admin/conversations/${enc(threadId)}`;
    let c;
    try { c = await api("GET", `${base}?reason=${enc(reason)}`); } catch (e) { return toast(e.message); }
    const people = c.people || {};
    const t = normThread({ ...(c.thread || c), messages: undefined }, people);
    const msgs = c.messages || c.thread?.messages || [];
    const canDel = can("chats.write") || can("reports.write");

      <div class="msgs">${msgs.map((m) => { const del = canDel && "system" !== m.from && !m.deleted; return `<div class="msg ${"me" === m.from ? "me" : "system" === m.from || "system" === m.kind ? "system" : ""} ${del ? "can-del" : ""} ${m.deleted ? "deleted" : ""}">${m.deleted ? `<span class="tag red">Deleted</span> ` : ""}<span class="body">${"text" === (m.kind || "text") || "system" === m.kind ? esc(msgText(m)) : `<i>[${esc(m.kind)}]</i> ${esc(msgText(m))}`}</span><small>${who(m.from)}${"system" === m.from ? "" : " · "}${fmt(m.at ?? m.ts)}</small>${del ? `<button class="btn small danger del" data-m="${esc(m.id)}" title="Delete this message">Delete</button>` : ""}</div>`; }).join("") || `<p class="hint">No messages.</p>`}</div>`);

    el.querySelectorAll("[data-m]").forEach((b) => (b.onclick = async () => {

      try { await api("DELETE", `${base}/messages/${enc(b.dataset.m)}?reason=${enc(r.reason)}`); toast("Deleted"); openChat(threadId, accountId, reason); } catch (e) { toast(e.message); }

  // Reports: 3 different reporters hide a person / home / message / team until staff decide; the server tells the
  // reporters the outcome.
  let reportStatus = "open";
  const RSTAT = { open: ["Open", "red"], reviewing: ["In review", "amber"], resolved: ["Resolved", "green"], dismissed: ["Dismissed", ""] };

  const RESOLVE = {
    keep: { title: "Keep it hidden?", hint: "It stays hidden until someone restores it (Handle on its report). The people who reported it are told.", confirm: "Keep hidden", status: "resolved" },
    restore: { title: "Restore it?", hint: "Nothing wrong found: it becomes visible again. The people who reported it are told.", confirm: "Restore", status: "resolved" },
    suspend: { title: "Suspend the account behind it?", hint: "The account is suspended and signed out, and its content stays hidden. The people who reported it are told.", confirm: "Suspend", status: "resolved", danger: true },
  };
  async function resolveReport(id, extra, action) {
    const R = RESOLVE[action];
    // Without a report id the server resolves by kind + target ("auto" is only a placeholder in the path).
    if (!id && !(extra?.kind && extra?.targetId)) return toast("The server didn't send enough to handle this item.");
    const r = await dialog({ title: R.title, body: `<p class="hint">${R.hint}</p>`, fields: [{ name: "note", label: "Note (sent to the reporters)", type: "textarea", placeholder: "Optional" }], confirm: R.confirm, danger: R.danger });
    if (!r) return;
    try { await api("POST", `/api/admin/reports/${enc(id || "auto")}`, { ...extra, status: R.status, action, note: r.note }); toast("Done. The reporters will be told."); VIEWS.reports(); refreshCounts(); } catch (e) { toast(e.message); }
  }
  VIEWS.reports = async () => {
    $("#main").innerHTML = `${page("Reports", "When 3 different people report the same person, home, message or team, it's hidden automatically until you decide. The people who reported it are told the outcome.")}
      <div class="chips">${[["open", "Open"], ["reviewing", "In review"], ["resolved", "Resolved"], ["dismissed", "Dismissed"], ["all", "All"]].map(([k, l]) => `<button class="chip ${k === reportStatus ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
      <div id="auto"></div>
      <div class="card tablewrap" id="tbl"><div class="empty">Loading…</div></div>`;
    $("#main").querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { reportStatus = b.dataset.f; VIEWS.reports(); }));
    const res = await api("GET", `/api/admin/reports?status=${reportStatus}`);
    const reports = (res.reports || []).map((r) => ({ ...r, kind: r.kind || r.about?.kind, about: r.about || { id: r.targetId, name: r.targetName || r.targetId }, reporter: r.reporter || {} }));
    // Hidden items: from the server, or grouped here from the reports marked autoHidden.
    let hidden = res.autoHidden || res.hidden;
    if (!Array.isArray(hidden)) {
      const groups = new Map();
      for (const r of reports.filter((x) => x.autoHidden && ["open", "reviewing"].includes(x.status || "open"))) {
        const k = `${r.kind}:${r.targetId || r.about.id}`;
        const g = groups.get(k) || { id: r.id, kind: r.kind, targetId: r.targetId || r.about.id, name: r.about.name, reporters: new Set(), reasons: new Set(), at: r.at };
        g.reporters.add(r.reporter.id);
        g.reasons.add(r.reason);
        groups.set(k, g);
      }
      hidden = [...groups.values()].map((g) => ({ ...g, reporters: g.reporters.size, reasons: [...g.reasons] }));
    }
    // An older server sent no report id here: use an open report of the same target from the list, if it's loaded.
    const openOf = (h) => reports.find((r) => r.kind === h.kind && (r.targetId || r.about?.id) === h.targetId && ["open", "reviewing"].includes(r.status || "open"));
    hidden = hidden.map((h) => ({ ...h, id: h.id || h.reportId || h.reportIds?.[0] || openOf(h)?.id, name: txt(h.name) || txt(h.title) || h.targetId, reporters: count(h.reporters ?? h.reporterCount), reasons: h.reasons || [] }));
    const w = can("reports.write");

    const canSuspend = can("users.suspend");
    $("#auto").innerHTML = hidden.length
      ? `<div class="card panel" style="margin-bottom:14px"><h3>Hidden automatically (${hidden.length})</h3><p class="hint" style="margin:-6px 0 12px">3 or more different people reported these. They stay hidden until you decide.</p><div class="list">${hidden
          .map((h, i) => `<div class="item"><div><span class="tag red">${esc(RKIND[h.kind] || h.kind || "Item")}</span> <b>${esc(h.name)}</b><span class="sub">${plural(h.reporters, "person", "people")} reported · ${esc(h.reasons.map((x) => REASON[x] || x).join(", ") || "—")} · ${ago(h.at ?? h.since)}</span></div>${w ? `<div class="row"><button class="btn small" data-res="${i}" data-act="keep">Keep hidden</button><button class="btn small primary" data-res="${i}" data-act="restore">Restore</button>${canSuspend ? `<button class="btn small danger" data-res="${i}" data-act="suspend">Suspend</button>` : ""}</div>` : ""}</div>`)
          .join("")}</div></div>`
      : "";
    $("#auto").querySelectorAll("[data-res]").forEach((b) => (b.onclick = () => { const h = hidden[b.dataset.res]; resolveReport(h.id, { kind: h.kind, targetId: h.targetId }, b.dataset.act); }));
    const outcome = (r) => { const o = r.resolution || {}; const act = o.action || r.action; const note = o.note ?? r.staffNote ?? (r.details != null ? r.note : null); return [OUTCOME[act], note, o.by || r.handledBy].filter(Boolean).map(esc).join(" · "); };
    $("#tbl").innerHTML = reports.length
      ? `<table><thead><tr><th>Reported by</th><th>About</th><th>Reason</th><th>When</th><th>Status</th><th></th></tr></thead><tbody>${reports
          .map((r) => `<tr data-id="${esc(r.id)}"><td><b>${esc(txt(r.reporter.name) || "")}</b><span class="sub">${esc(r.reporter.email || r.reporter.id || "")}</span></td><td>${r.kind ? `<span class="tag">${esc(RKIND[r.kind] || r.kind)}</span> ` : ""}${esc(txt(r.about.name) || r.about.id || "—")}${r.autoHidden ? `<span class="sub"><span class="tag red">Hidden by reports</span></span>` : ""}${r.reporters ? `<span class="sub">${plural(count(r.reporters), "reporter")} in total</span>` : ""}</td><td><b>${esc(REASON[r.reason] || r.reason)}</b><span class="sub">${esc(r.details ?? r.note ?? "")}</span></td><td>${fmt(r.at)}</td><td><span class="tag ${RSTAT[r.status]?.[1] || ""}">${RSTAT[r.status]?.[0] || esc(r.status || "Open")}</span>${outcome(r) ? `<span class="sub">${outcome(r)}</span>` : ""}</td><td><div class="row">${r.reporter.id && can("users.read") ? `<button class="btn small" data-who="${esc(r.reporter.id)}">Reporter</button>` : ""}${w ? `<button class="btn small primary" data-handle>Handle</button>` : ""}</div></td></tr>`)
          .join("")}</tbody></table>`
      : `<div class="empty">No ${"all" === reportStatus ? "" : (RSTAT[reportStatus]?.[0] || "").toLowerCase() + " "}reports.</div>`;
    $("#tbl").querySelectorAll("[data-who]").forEach((b) => (b.onclick = () => openAccount(rawId(b.dataset.who))));
    $("#tbl").querySelectorAll("[data-handle]").forEach((b) => (b.onclick = async () => {
      const row = reports.find((x) => String(x.id) === b.closest("tr").dataset.id) || {};
      const r = await dialog({ title: "Handle this report", body: `<label class="field">Outcome<select class="input" name="outcome"><option value="keep">Something was wrong: keep it hidden / take it down</option><option value="restore">Nothing wrong: restore it</option>${canSuspend ? `<option value="suspend">Suspend the account behind it</option>` : ""}<option value="reviewing">Still looking (in review)</option><option value="dismissed">Dismiss</option><option value="open">Reopen</option></select></label><p class="hint">The reporter is told the outcome.</p>`, fields: [{ name: "note", label: "What was done (sent to the reporter)", type: "textarea", placeholder: "e.g. we removed the home / not enough evidence" }], confirm: "Save" });
      if (!r) return;
      const action = RESOLVE[r.outcome] ? r.outcome : undefined;
      const body = { status: action ? "resolved" : r.outcome, ...(action ? { action } : {}), note: r.note, kind: row.kind, targetId: row.targetId || row.about?.id };
      try { await api("POST", `/api/admin/reports/${enc(row.id)}`, body); toast("Saved. The reporter will be told."); VIEWS.reports(); refreshCounts(); } catch (e) { toast(e.message); }
    }));
  };

  // Settings
  const PRICE_LABEL = [["gold", "Gold membership", "/ month"], ["diamond", "Diamond membership", "/ month"], ["agent5", "Agent plan, 5 homes", "/ month"], ["agent10", "Agent plan, 10 homes", "/ month"], ["pin", "Pin a home", "30 days"], ["verify", "Identity verification", "3 years"], ["invites10", "Invite pack", "10 invites"], ["leaseCheck", "AI lease check", "each"], ["contract", "Online contract", "each"]];

      <div class="grid2">
        <form class="card panel" id="ann" style="display:grid;gap:12px"><h3>Announcement banner</h3>

  // Test accounts: made in bulk with presets (member, approved landlord, licensed agent; membership, verified badge,

  // ---- Stress test: many test accounts at once, from this browser, against the API with each tester's own session.
  // Safety caps: at most 50 at a time, 5 minutes, and 20 requests a second in total (up to 50 with an explicit
  // override). The server also caps traffic from test accounts.
  const STRESS = { maxConc: 50, maxSecs: 300, rateCap: 20, rateHard: 50 };
  const SCEN = [
    ["feed", "Browse the feed", "GET /feed (people, homes, teams)", 4],
    ["inbox", "Poll messages", "GET /inbox, as the app does every few seconds", 3],
    ["home", "Open homes", "POST /chat/listing: opens the inquiry chat of a live test home", 2],
    ["chat", "Chat between testers", "POST /chat/start, then /chat/send", 3],
    ["listing", "Post or update a listing", "GET /state, then PUT /state with a changed home", 1],
    ["apply", "Apply to a home", "POST /applications", 1],
    ["teams", "Create or join teams", "POST /teams, POST /teams/:id/join", 1],
  ];
  let stressRun = null;
  const pct = (sorted, p) => (sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor((p / 100) * sorted.length))] : 0);
  VIEWS.stress = async () => {
    $("#main").innerHTML = `${page("Stress test", "Runs from this browser: each request goes to the ColivEase API with a test account's own session. Pick the accounts and what they do, then watch requests per second, latency and errors live.")}
      <div class="notice" style="margin-bottom:14px"><b>Careful:</b> this hits the real backend (Supabase project ${esc(API.replace(/^https?:\/\//, "").split("/")[0])}). The Supabase organisation is close to its quota: keep runs short and small. Hard caps: ${STRESS.maxConc} accounts at a time, ${STRESS.maxSecs / 60} minutes, ${STRESS.rateCap} requests a second in total. Only test accounts take part, and their data stays invisible to real users.</div>
      <form class="card panel" id="st-f" style="display:grid;gap:14px;margin-bottom:14px">
        <h3 style="margin:0">Setup</h3>
        <div class="form-grid">
          <label class="field">Concurrency (1–${STRESS.maxConc})<input class="input sm num" name="conc" type="number" min="1" max="${STRESS.maxConc}" value="5"></label>
          <label class="field">Duration (seconds, 10–${STRESS.maxSecs})<input class="input sm num" name="secs" type="number" min="10" max="${STRESS.maxSecs}" value="60"></label>
          <label class="field">Requests a second (total)<input class="input sm num" name="rate" type="number" min="0.5" step="0.5" max="${STRESS.rateHard}" value="5"></label>
          <label class="toggle"><input type="checkbox" name="over">Allow more than ${STRESS.rateCap} a second (up to ${STRESS.rateHard})</label>
          <label class="toggle"><input type="checkbox" name="signout" checked>Sign the test accounts out afterwards</label>
        </div>
        <div><span class="hint">What they do (weights: how often each is picked; 0 = never)</span>
          <div class="form-grid" style="margin-top:6px">${SCEN.map(([k, l, d, w]) => `<label class="field">${esc(l)}<input class="input sm num" name="w_${k}" type="number" min="0" max="10" value="${w}"><span class="hint">${esc(d)}</span></label>`).join("")}</div></div>
        <div><div class="row" style="justify-content:space-between"><span class="hint">Test accounts (pick up to ${STRESS.maxConc})</span><span class="row"><button type="button" class="btn small" id="st-10">First 10</button><button type="button" class="btn small" id="st-none">None</button></span></div>
          <div class="pick" id="st-acc" style="margin-top:8px"><span class="hint">Loading…</span></div></div>
        <div class="row"><button class="btn primary" id="st-go">Start</button><span class="hint" id="st-msg"></span></div>
      </form>
      <div id="st-out"></div>`;
    let testers = [];
    try { testers = (await api("GET", "/api/admin/testers")).testers || []; } catch (e) { $("#st-acc").innerHTML = `<span class="hint">${esc(e.message)}</span>`; }
    $("#st-acc").innerHTML = testers.length ? testers.map((t) => `<label><input type="checkbox" value="${esc(t.id)}">${esc(txt(t.name) || t.email)}${"agent" === t.kind ? " · agent" : ""}</label>`).join("") : `<span class="hint">No test accounts yet. Create some under Test accounts.</span>`;
    const boxes = () => [...document.querySelectorAll("#st-acc input")];
    $("#st-10").onclick = () => boxes().forEach((c, i) => (c.checked = i < 10));
    $("#st-none").onclick = () => boxes().forEach((c) => (c.checked = false));
    if (stressRun) drawStress();
    $("#st-f").onsubmit = async (e) => {
      e.preventDefault();
      if (stressRun?.running) return toast("A run is still going. Stop it first.");
      const f = Object.fromEntries(new FormData(e.target));
      const ids = boxes().filter((c) => c.checked).map((c) => c.value);
      if (!ids.length) return toast("Pick some test accounts");
      if (ids.length > STRESS.maxConc) return toast(`At most ${STRESS.maxConc} test accounts`);
      const over = "on" === f.over;
      const cfg = {
        conc: Math.max(1, Math.min(STRESS.maxConc, Math.floor(Number(f.conc) || 1))),
        secs: Math.max(10, Math.min(STRESS.maxSecs, Math.floor(Number(f.secs) || 60))),
        rate: Math.max(0.5, Math.min(over ? STRESS.rateHard : STRESS.rateCap, Number(f.rate) || 5)),
        weights: Object.fromEntries(SCEN.map(([k]) => [k, Math.max(0, Math.min(10, Number(f[`w_${k}`]) || 0))])),
        signout: "on" === f.signout,
        accounts: ids.length,
      };
      if (!Object.values(cfg.weights).some((w) => w > 0)) return toast("Give at least one scenario a weight above 0");
      if (over && !(await dialog({ title: `Run at up to ${cfg.rate} requests a second?`, body: `<div class="notice">That's above the usual ${STRESS.rateCap} a second. The Supabase organisation is near its quota; a high rate can use it up for everyone, real users included.</div>`, confirm: "Run it", danger: true }))) return;
      if (!(await dialog({ title: "Start the stress test?", body: `<p class="hint">${plural(ids.length, "test account")}, ${cfg.conc} at a time, ${cfg.rate} requests a second at most, for ${cfg.secs} seconds. It writes test data (chats, applications, teams, home edits) that only test accounts see.</p>`, confirm: "Start" }))) return;
      $("#st-msg").textContent = "Opening sessions…";
      let sessions;
      try { sessions = await testerSessions(ids, "stress"); } catch (er) { $("#st-msg").textContent = er.message; return toast(er.message); }
      $("#st-msg").textContent = "";
      runStress(cfg, sessions, testers);
    };
  };
  function runStress(cfg, sessions, testers) {
    const byId = new Map(testers.map((t) => [t.id, t]));
    const people = sessions.map((s) => ({ ...s, kind: byId.get(s.accountId)?.kind || s.kind, homes: [], teamId: null, applied: new Set(), threads: new Map() }));
    const run = { cfg, started: Date.now(), ends: Date.now() + cfg.secs * 1000, running: true, samples: [], perSec: new Map(), byEp: new Map(), errors: new Map(), inflight: 0, sent: 0, people, knownHomes: [], teams: [], notes: [] };
    stressRun = run;
    // Requests a second for everyone together: a token bucket refilled every 50 ms.
    let tokens = 1;
    const waiters = [];
    const tick = setInterval(() => {
      tokens = Math.min(Math.max(1, cfg.rate), tokens + cfg.rate / 20);
      while (tokens >= 1 && waiters.length) { tokens -= 1; waiters.shift().res(); }
      if (Date.now() >= run.ends) stop();
    }, 50);
    const slot = () => (run.running ? new Promise((res, rej) => waiters.push({ res, rej })) : Promise.reject(new Error("stopped")));
    const record = (ep, r) => {
      const sec = Math.floor((Date.now() - run.started) / 1000);
      const s = run.perSec.get(sec) || { n: 0, err: 0, ms: [] };
      s.n++;
      s.ms.push(r.ms);
      const bad = !(r.status >= 200 && r.status < 400);
      if (bad) s.err++;
      run.perSec.set(sec, s);
      const e = run.byEp.get(ep) || { n: 0, err: 0, ms: [] };
      e.n++;
      e.ms.push(r.ms);
      if (bad) e.err++;
      run.byEp.set(ep, e);
      if (bad) { const key = `${r.status || "network"}${r.code ? ` ${r.code}` : ""}`; run.errors.set(key, (run.errors.get(key) || 0) + 1); }
      if (run.samples.length < 20000) run.samples.push({ t: Math.round(Date.now() - run.started), ep, status: r.status, ms: Math.round(r.ms), code: r.code || undefined });
    };
    const call = async (who, method, path, body, ep) => {
      await slot();
      run.inflight++;
      run.sent++;
      try { const r = await testerCall(who.token, method, `/api${path}`, body); record(ep, r); return r; } finally { run.inflight--; }
    };
    const pick = (list) => list[Math.floor(Math.random() * list.length)];
    const members = people.filter((p) => "agent" !== p.kind);
    const learnFeed = (r) => {
      const ls = r?.json?.listings;
      if (Array.isArray(ls)) run.knownHomes = ls.slice(0, 200).map((l) => ({ id: l.id, host: l.hostId }));
      const ts = r?.json?.teams;
      if (Array.isArray(ts)) run.teams = ts.filter((t) => !t.full).slice(0, 100).map((t) => t.id);
    };
    const ops = {
      feed: async (me) => learnFeed(await call(me, "GET", "/feed?langs=en,zh", null, "GET /feed")),
      inbox: async (me) => call(me, "GET", "/inbox", null, "GET /inbox"),
      home: async (me) => {
        const others = run.knownHomes.filter((x) => x.host !== `acct:${me.accountId}`);
        // No home of someone else known yet: browse instead (that request also learns the homes).
        if (!others.length) return ops.feed(me);
        await call(me, "POST", "/chat/listing", { listingId: pick(others).id }, "POST /chat/listing");
      },
      chat: async (me) => {
        if ("agent" === me.kind || members.length < 2) return ops.inbox(me);
        const other = pick(members.filter((p) => p !== me));
        let th = me.threads.get(other.accountId);
        if (!th) {
          const r = await call(me, "POST", "/chat/start", { to: `acct:${other.accountId}`, note: "Stress test hello" }, "POST /chat/start");
          th = r.json?.thread?.id;
          if (!th) return;
          me.threads.set(other.accountId, th);
          other.threads.set(me.accountId, th);
        }
        await call(me, "POST", "/chat/send", { threadId: th, text: `Stress test message ${new Date().toISOString().slice(11, 19)}` }, "POST /chat/send");
      },
      listing: async (me) => {
        const r = await call(me, "GET", "/state", null, "GET /state");
        const doc = r.json?.doc;
        if (!doc) return;
        const own = (doc.listings || []).filter((l) => ["me", "landlord"].includes(l?.hostId));
        let listings;
        if (own.length) {
          const l = pick(own);
          listings = (doc.listings || []).map((x) => (x === l ? { ...x, price: (Number(x.price) || 1000) + (Math.random() < 0.5 ? -5 : 5), updatedAt: Date.now() } : x));
        } else {
          listings = [...(doc.listings || []), { id: `st${Date.now().toString(36)}`, hostId: "member" === me.kind || !me.kind ? "me" : "landlord", kind: "room", title: { zh: "压力测试房源", en: "Stress test home" }, district: "downtown", price: 1000, beds: 1, baths: 1, photos: [], postedAt: Date.now(), updatedAt: Date.now() }];
        }
        await call(me, "PUT", "/state", { baseRev: r.json.rev, doc: { ...doc, listings }, changedKeys: ["listings"] }, "PUT /state");
      },
      apply: async (me) => {
        if ("agent" === me.kind) return ops.feed(me);
        if (!run.knownHomes.length) return ops.feed(me);
        const open = run.knownHomes.filter((h) => h.host !== `acct:${me.accountId}` && !me.applied.has(h.id));
        if (!open.length) return ops.inbox(me);
        const h = pick(open);
        me.applied.add(h.id);
        await call(me, "POST", "/applications", { listingId: h.id, note: "Stress test application" }, "POST /applications");
      },
      teams: async (me) => {
        if ("agent" === me.kind) return ops.feed(me);
        const joinable = run.teams.filter((id) => id !== me.teamId);
        if (me.teamId || (joinable.length && Math.random() < 0.6)) {
          if (!joinable.length) return ops.feed(me);
          await call(me, "POST", `/teams/${encodeURIComponent(pick(joinable))}/join`, { note: "Stress test" }, "POST /teams/:id/join");
        } else {
          const r = await call(me, "POST", "/teams", { name: `Stress team ${Math.floor(Math.random() * 1000)}`, emoji: "🧪", targetSize: 5, areas: ["downtown"], budget: [900, 1500], open: true }, "POST /teams");
          if (r.json?.team?.id) { me.teamId = r.json.team.id; run.teams.push(me.teamId); }
        }
      },
    };
    const weighted = Object.entries(cfg.weights).filter(([, w]) => w > 0);
    const total = weighted.reduce((x, [, w]) => x + w, 0);
    const choose = () => { let r = Math.random() * total; for (const [k, w] of weighted) if ((r -= w) < 0) return k; return weighted[0][0]; };
    const pause = (ms) => new Promise((res) => setTimeout(res, ms));
    const worker = async (i) => {
      while (run.running) {
        const me = people[i % people.length];
        const before = run.sent;
        try { await ops[choose()](me); } catch (e) { if ("stopped" !== e?.message && run.notes.length < 50) run.notes.push(String(e?.message || e)); }
        // Always give the page a turn; an op that sent nothing (no eligible target) waits a little longer, so a worker
        // can never spin and freeze the tab.
        await pause(run.sent === before ? 200 : 0);
      }
    };
    function stop() {
      if (!run.running) return;
      run.running = false;
      run.stoppedAt = Date.now();
      clearInterval(tick);
      while (waiters.length) waiters.shift().rej(new Error("stopped"));
      if (cfg.signout) api("POST", "/api/admin/testers/sessions/revoke", { ids: people.map((p) => p.accountId) }).catch(() => {});
      drawStress();
      // Answers still on their way when it stopped are counted too.
      setTimeout(() => "stress" === view && drawStress(), 2500);
    }
    run.stop = stop;
    for (let i = 0; i < cfg.conc; i++) worker(i);
    const ui = setInterval(() => { if (!run.running) clearInterval(ui); if ("stress" === view) drawStress(); }, 500);
    drawStress();
  }
  function stressSummary(run) {
    const all = run.samples.map((s) => s.ms).sort((a, b) => a - b);
    const secs = Math.max(1, ((run.stoppedAt || Date.now()) - run.started) / 1000);
    const last = [...run.perSec.entries()].filter(([s]) => s >= Math.floor((Date.now() - run.started) / 1000) - 10).flatMap(([, v]) => v.ms).sort((a, b) => a - b);
    const errs = [...run.errors.values()].reduce((x, n) => x + n, 0);
    return { requests: run.samples.length, errors: errs, errorRate: run.samples.length ? errs / run.samples.length : 0, rps: run.samples.length / secs, p50: pct(all, 50), p95: pct(all, 95), max: all[all.length - 1] || 0, p95last10s: pct(last, 95), seconds: Math.round(secs) };
  }
  function drawStress() {
    const run = stressRun;
    const out = $("#st-out");
    if (!run || !out) return;
    const s = stressSummary(run);
    const left = Math.max(0, Math.round((run.ends - Date.now()) / 1000));
    const series = [];
    const lastSec = Math.max(...run.perSec.keys(), 0);
    for (let i = 0; i <= lastSec; i++) { const v = run.perSec.get(i) || { n: 0, err: 0, ms: [] }; series.push({ n: v.n, err: v.err, p95: pct([...v.ms].sort((a, b) => a - b), 95) }); }
    const W = 600, H = 120;
    const maxN = Math.max(1, ...series.map((x) => x.n));
    const maxMs = Math.max(100, ...series.map((x) => x.p95));
    const x = (i) => (series.length > 1 ? (i / (series.length - 1)) * W : 0);
    const line = (key, max) => series.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${(H - (v[key] / max) * (H - 8) - 4).toFixed(1)}`).join("");
    const eps = [...run.byEp.entries()].map(([ep, v]) => { const ms = [...v.ms].sort((a, b) => a - b); return { ep, n: v.n, err: v.err, p50: pct(ms, 50), p95: pct(ms, 95), max: ms[ms.length - 1] || 0 }; }).sort((a, b) => b.n - a.n);
    out.innerHTML = `<div class="card panel">
      <div class="row" style="justify-content:space-between"><h3 style="margin:0">${run.running ? `Running · ${left}s left` : `Finished after ${s.seconds}s`}</h3>
        <div class="row">${run.running ? `<button class="btn danger" id="st-stop">Stop</button>` : `<button class="btn" id="st-again">New run</button>`}<button class="btn" id="st-json">Export JSON</button></div></div>
      <div class="kpis">
        <div class="card kpi"><small>Requests a second</small><b>${s.rps.toFixed(1)}</b><span class="hint">cap ${run.cfg.rate}/s</span></div>
        <div class="card kpi"><small>Requests</small><b>${s.requests}</b><span class="hint">${run.inflight} in flight</span></div>
        <div class="card kpi"><small>p50 latency</small><b>${Math.round(s.p50)} ms</b></div>
        <div class="card kpi"><small>p95 latency</small><b>${Math.round(s.p95)} ms</b><span class="hint">last 10 s: ${Math.round(s.p95last10s)} ms</span></div>
        <div class="card kpi"><small>Errors</small><b style="color:${s.errors ? "var(--red)" : "inherit"}">${s.errors}</b><span class="hint">${(s.errorRate * 100).toFixed(1)}%</span></div>
        <div class="card kpi"><small>Accounts · at a time</small><b>${run.people.length} · ${run.cfg.conc}</b></div>
      </div>
      <div class="grid2"><div><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Requests a second and p95 latency over time"><line class="grid" x1="0" y1="${H - 4}" x2="${W}" y2="${H - 4}"/><path class="rps" d="${line("n", maxN)}"/><path class="p95" d="${line("p95", maxMs)}"/>${series.map((v, i) => (v.err ? `<circle class="err" cx="${x(i).toFixed(1)}" cy="${H - 6}" r="3"/>` : "")).join("")}</svg>
        <div class="legend"><span><i style="background:var(--blue)"></i>requests/s (max ${maxN})</span><span><i style="background:#F59E0B"></i>p95 ms (max ${Math.round(maxMs)})</span><span><i style="background:var(--red);height:6px;width:6px;border-radius:50%"></i>errors</span></div></div>
        <div><h3 style="font-size:15px;margin:0 0 6px">Errors by status / code</h3>${run.errors.size ? `<div class="list">${[...run.errors.entries()].sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="item"><span>${esc(k)}</span><b>${n}</b></div>`).join("")}</div>` : `<p class="hint">None so far.</p>`}</div></div>
      <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Endpoint</th><th>Requests</th><th>Errors</th><th>p50</th><th>p95</th><th>Max</th></tr></thead><tbody>${eps.map((e) => `<tr><td>${esc(e.ep)}</td><td>${e.n}</td><td>${e.err ? `<span class="tag red">${e.err}</span>` : "0"}</td><td>${Math.round(e.p50)} ms</td><td>${Math.round(e.p95)} ms</td><td>${Math.round(e.max)} ms</td></tr>`).join("") || `<tr><td colspan="6" class="hint">Waiting for the first answers…</td></tr>`}</tbody></table></div>
      ${run.notes.length ? `<p class="hint">${esc(run.notes.slice(-3).join(" · "))}</p>` : ""}
    </div>`;
    const stopBtn = $("#st-stop");
    if (stopBtn) stopBtn.onclick = () => run.stop();
    const again = $("#st-again");
    if (again) again.onclick = () => { stressRun = null; VIEWS.stress(); };
    $("#st-json").onclick = () => downloadFile(`colivease-stress-${stamp()}.json`, JSON.stringify({ api: API, config: run.cfg, startedAt: new Date(run.started).toISOString(), summary: stressSummary(run), endpoints: eps, errors: Object.fromEntries(run.errors), perSecond: series, samples: run.samples, accounts: run.people.map((p) => ({ id: p.accountId, kind: p.kind })) }, null, 2), "application/json");
  }

  fromEmailLink().then((handled) => {
    if (handled) return;
    if (TOKEN && API) start();
    else showSignin();
  });
})();
</script>
</body>
</html>
