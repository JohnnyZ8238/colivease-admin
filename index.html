<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ColivEase Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* The ColivEase look (same as www.colivease.ca): grid paper, glass cards, Fredoka headings, Poppins text, ColivEase
   blue on navy ink, pill buttons. */
:root {
  --ink: #0B2255; --ink-2: #33415C; --muted: #64748B; --faint: #94A3B8; --line: #E2E8F0; --soft: #F1F5FF; --bg: #F5F7FB;
  --blue: #2865FF; --blue-2: #4F83FF; --blue-deep: #1A4FE0; --blue-soft: #E7EFFE;
  --green: #15803D; --green-soft: #DCFCE7; --red: #DC2626; --red-soft: #FEE2E2; --amber: #B45309; --amber-soft: #FEF3C7;
  --glass: rgba(255,255,255,.86); --white: #fff;
  --display: Fredoka, "Poppins", system-ui, sans-serif; --body: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 2px rgba(11,34,85,.04), 0 18px 40px -26px rgba(11,34,85,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(rgba(40,101,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(40,101,255,.05) 1px, transparent 1px); background-size: 44px 44px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.2px; }

/* brand */
.brand { display: flex; align-items: center; gap: 10px; font: 700 20px var(--display); color: var(--ink); }
.mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue-2), var(--blue-deep)); color: #fff; font: 700 21px var(--display); box-shadow: 0 8px 18px -8px rgba(40,101,255,.8); }
.brand small { font: 600 11px var(--body); color: var(--blue); background: var(--blue-soft); padding: 2px 8px; border-radius: 999px; }

/* sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.card { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(226,232,240,.9); border-radius: 22px; box-shadow: var(--shadow); }
.signin .card { width: 100%; max-width: 430px; padding: 32px; display: grid; gap: 16px; }
.signin h1 { margin: 6px 0 0; font-size: 30px; }
.signin p { margin: 0; color: var(--muted); }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: 13px; color: var(--ink); }
.input, select.input, textarea.input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--white); outline: none; font-weight: 400; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(40,101,255,.12); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
details summary { cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font: 600 13px var(--body); white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s, transform .1s; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 10px 22px -12px rgba(40,101,255,.9); }
.btn.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue); }
.btn.ghost:hover { background: var(--blue-soft); }
.btn.danger { color: var(--red); border-color: #FCA5A5; }
.btn.danger:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { height: 32px; padding: 0 12px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.error { color: var(--red); font-size: 13px; min-height: 1em; }
.notice { padding: 12px 14px; border-radius: 14px; background: var(--amber-soft); color: #78350F; font-size: 13px; }
.notice.blue { background: var(--blue-soft); color: var(--ink); }

/* shell */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.side { padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-right: 1px solid var(--line); }
.side .brand { padding: 4px 8px 20px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-weight: 500; text-align: left; transition: background-color .15s, color .15s; }
.nav button:hover { background: var(--soft); color: var(--ink); }
.nav button.on { background: var(--blue); color: #fff; box-shadow: 0 10px 20px -12px rgba(40,101,255,.9); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; background: #F59E0B; color: #111; font-size: 11px; font-weight: 700; text-align: center; line-height: 20px; }
.side .who { margin-top: auto; padding: 14px; border-radius: 18px; background: var(--white); border: 1px solid var(--line); font-size: 12px; display: grid; gap: 8px; }
.side .who b { color: var(--ink); word-break: break-all; font-size: 13px; }
.side .who .row { gap: 6px; }
.main { padding: 28px 34px 64px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h2 { margin: 0; font-size: 30px; }
.head p { margin: 2px 0 0; color: var(--muted); max-width: 70ch; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools .input { width: 280px; border-radius: 999px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { padding: 18px; }
.stat small { color: var(--muted); font-weight: 500; }
.stat b { display: block; font: 700 30px var(--display); margin-top: 2px; color: var(--ink); }
.stat em { font-style: normal; font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.panel { padding: 20px; min-width: 0; }
.panel h3 { margin: 0 0 12px; font-size: 18px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
.bars div { flex: 1; display: grid; align-content: end; justify-items: center; gap: 4px; height: 100%; font-size: 10px; color: var(--muted); }
.bars span { width: 100%; max-width: 26px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--blue-2), var(--blue)); min-height: 3px; }

/* tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: rgba(231,239,254,.45); }
td .sub, .item .sub { display: block; color: var(--muted); font-size: 12px; }
.empty { padding: 44px; text-align: center; color: var(--muted); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* drawer + dialog */
.scrim { position: fixed; inset: 0; background: rgba(11,34,85,.32); backdrop-filter: blur(3px); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--white); z-index: 21; overflow-y: auto; padding: 26px; box-shadow: -24px 0 60px -24px rgba(11,34,85,.4); display: grid; align-content: start; gap: 20px; border-radius: 24px 0 0 24px; }
.drawer h3 { margin: 0; font-size: 24px; }
.drawer section { display: grid; gap: 10px; }
.drawer h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.toggle input { width: 18px; height: 18px; accent-color: var(--blue); }
.list { display: grid; gap: 8px; }
.list .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); }
.dialog { position: fixed; z-index: 31; left: 50%; top: 50%; translate: -50% -50%; width: min(470px, calc(100vw - 32px)); padding: 24px; display: grid; gap: 14px; background: var(--white); }
.dialog h3 { margin: 0; font-size: 22px; }
.close { position: absolute; top: 16px; right: 16px; }

/* chat transcript */
.msgs { display: grid; gap: 8px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; background: var(--soft); position: relative; }
.msg.me { justify-self: end; background: var(--blue); color: #fff; }
.msg.me small { color: rgba(255,255,255,.8); }
.msg.system { justify-self: center; background: transparent; color: var(--muted); font-size: 12px; text-align: center; }
.msg small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.msg.can-del { padding-right: 56px; }
.msg .del { position: absolute; top: 6px; right: 6px; }
.toast { position: fixed; bottom: 22px; left: 50%; translate: -50% 0; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; z-index: 40; font-weight: 500; box-shadow: var(--shadow); }
.matrix td, .matrix th { text-align: center; }
.tabs { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--soft); gap: 2px; }
.tabs button { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button.on { background: var(--white); color: var(--ink); box-shadow: 0 2px 8px rgba(11,34,85,.12); }
.channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
.channel { padding: 18px; display: grid; gap: 8px; align-content: start; }
.channel h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: #22C55E; box-shadow: 0 0 0 4px rgba(34,197,94,.15); }
.dot.off { background: #F59E0B; box-shadow: 0 0 0 4px rgba(245,158,11,.15); }
.cat { margin: 18px 0 8px; font: 700 15px var(--display); color: var(--ink); }
.tpl { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tpl:last-child { border-bottom: 0; }
.tpl:hover { background: rgba(231,239,254,.45); }
.vars { display: flex; flex-wrap: wrap; gap: 6px; }
.var { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px dashed #A7C1FF; background: var(--blue-soft); color: var(--blue); font: 600 12px var(--body); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preview { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); }
.pushcard { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); }
.pushcard .mark { width: 34px; height: 34px; font-size: 18px; border-radius: 10px; }
@media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
.matrix td:first-child, .matrix th:first-child { text-align: left; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .brand, .side .who { display: none; }
  .nav { display: contents; }
  .nav button { width: auto; }
  .main { padding: 18px 16px 50px; }
  .grid2 { grid-template-columns: 1fr; }
  .tools .input { width: 100%; }
  .drawer { border-radius: 0; }
}
</style>
</head>
<body>

<div class="signin" id="signin" hidden>
  <form class="card" id="signin-form">
    <div class="brand"><span class="mark">E</span>ColivEase <small>Admin</small></div>
    <div><h1>Sign in</h1><p>Admins only. Every action is recorded.</p></div>
    <label class="field">Email<input class="input" id="email" type="email" autocomplete="username" required></label>
    <label class="field" id="pw-field">Password<input class="input" id="password" type="password" autocomplete="current-password"></label>
    <div class="notice blue" id="sent-note" hidden></div>
    <label class="field" id="code-field" hidden>Or enter the code from the email<input class="input" id="code" inputmode="numeric" autocomplete="one-time-code"></label>
    <div class="error" id="signin-error"></div>
    <button class="btn primary" id="signin-go" type="submit">Sign in</button>
    <button class="btn ghost" id="link-go" type="button">First time, or forgot your password? Email me a sign-in link</button>
    <details id="api-box"><summary class="hint">Server</summary><label class="field" style="margin-top:8px">Server address<input class="input" id="api" required><span class="hint">The ColivEase backend. For local testing: http://localhost:8787</span></label></details>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brand"><span class="mark">E</span>ColivEase <small>Admin</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span class="hint">Signed in as</span><b id="who-email"></b><span id="who-role" class="tag blue" style="justify-self:start"></span><div class="row"><button class="btn small" id="setpw">Password</button><button class="btn small" id="signout">Sign out</button></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  const fmt = (ts) => (ts ? new Date(ts).toLocaleString("en-CA", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—");
  const ago = (ts) => {
    if (!ts) return "—";
    const m = Math.round((Date.now() - ts) / 6e4);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
  };
  const plural = (n, one, many = `${one}s`) => `${n} ${1 === n ? one : many}`;
  const LANG = { zh: "Chinese", en: "English", ko: "Korean", es: "Spanish", fr: "French", hi: "Hindi/Punjabi", vi: "Vietnamese", tl: "Tagalog", fa: "Farsi", pt: "Portuguese" };
  const KIND = { roommate: "Roommate", group: "Group", host: "Landlord / sublet", landlord: "Landlord", realtor: "Agent" };
  const ROLE = { owner: "Owner", admin: "Admin", moderator: "Moderator", support: "Support (read-only)" };
  const ACTION = {
    "account.signout": "Signed out everywhere", "account.suspend": "Suspended account", "account.unsuspend": "Lifted suspension", "account.update": "Edited account", "account.plans": "Changed membership / mode", "account.delete": "Deleted account",
    "listing.update": "Changed home status", "listing.approve": "Approved home", "listing.reject": "Rejected home", "listing.delete": "Deleted home", "chat.read": "Read a chat", "chat.message.delete": "Deleted a message", "report.update": "Handled report",
    "broadcast": "Sent a broadcast", "settings.update": "Changed site settings", "admin.set": "Set admin role", "admin.remove": "Removed admin",
    "notify.template": "Edited a notification", "notify.template.reset": "Reset a notification",
  };
  const ICON = {
    overview: '<path d="M3 13h8V3H3zM13 21h8v-8h-8zM3 21h8v-6H3zM13 3v8h8V3z"/>',
    accounts: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2c3 .2 5.5 2.6 5.5 5.8"/>',
    listings: '<path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/>',
    chats: '<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',
    reports: '<path d="M5 21V4h11l-1.5 4L16 12H5"/>',
    members: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
    broadcast: '<path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/>',
    admins: '<path d="M12 3l8 3v6c0 4.5-3.4 7.7-8 9-4.6-1.3-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    audit: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    notifications: '<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>',
  };

  const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
  // The ColivEase backend: the "api" Edge Function in ColivEase's own Supabase project (supabase/functions/api).
  const DEFAULT_API = LOCAL ? "http://localhost:8787" : "https://hwamygorfxbdpzaowomd.supabase.co/functions/v1";
  // The project's public anon key (safe in a web page; it only gets requests past Supabase's gateway — the function
  // checks the ColivEase session in x-cv-token). Filled in by scripts/web/assemble-admin.mjs.
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3YW15Z29yZnhiZHB6YW93b21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTY4NjEsImV4cCI6MjEwODI3Mjg2MX0.FW7PuZi3HY6nZhezMHE6VdWtPznYiZpWoQEZRZUWj-4";
  const savedApi = store.get("cv-admin-api");
  let API = savedApi && "https://api.colivease.ca" !== savedApi ? savedApi : DEFAULT_API;
  let TOKEN = store.get("cv-admin-token");
  let ME = null;
  let view = "overview";
  const can = (p) => ME?.permissions?.includes(p) || (p === "users.suspend" && ME?.permissions?.includes("users.write"));

  async function api(method, path, body) {
    const r = await fetch(API.replace(/\/$/, "") + path, {
      method,
      headers: API.includes(".supabase.co")
        ? { "content-type": "application/json", apikey: ANON_KEY, authorization: `Bearer ${ANON_KEY}`, ...(TOKEN ? { "x-cv-token": TOKEN } : {}) }
        : { "content-type": "application/json", ...(TOKEN ? { authorization: `Bearer ${TOKEN}` } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    }).catch(() => { throw new Error(API === DEFAULT_API && !LOCAL ? "Can't reach the ColivEase backend right now. Try again in a moment." : "Can't reach the server. Check the address under “Server”, and that the server is running."); });
    const json = await r.json().catch(() => ({}));
    if (401 === r.status && TOKEN && !path.startsWith("/api/auth/")) { signOut(); throw new Error("Your session expired. Sign in again."); }
    if (!r.ok) throw Object.assign(new Error(json.error || `Something went wrong (${r.status})`), { status: r.status });
    return json;
  }
  function toast(text) {
    const el = document.createElement("div");

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  // ---- dialogs (built into the page: browser prompts aren't used)
  function dialog({ title, body = "", fields = [], confirm = "OK", danger = false }) {
    return new Promise((resolve) => {
      const scrim = document.createElement("div");
      scrim.className = "scrim";
      scrim.style.zIndex = 30;
      const box = document.createElement("form");
      box.className = "card dialog";
      box.innerHTML = `<h3>${esc(title)}</h3>${body ? `<div>${body}</div>` : ""}${fields
        .map((f) => `<label class="field">${esc(f.label)}${f.type === "textarea" ? `<textarea class="input" name="${f.name}" rows="3" ${f.required ? "required" : ""} placeholder="${esc(f.placeholder || "")}">${esc(f.value || "")}</textarea>` : `<input class="input" name="${f.name}" type="${f.type || "text"}" ${f.required ? "required" : ""} ${f.minlength ? `minlength="${f.minlength}"` : ""} placeholder="${esc(f.placeholder || "")}" value="${esc(f.value || "")}">`}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</label>`)
        .join("")}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancel</button><button class="btn ${danger ? "danger" : "primary"}">${esc(confirm)}</button></div>`;
      const done = (v) => { scrim.remove(); box.remove(); resolve(v); };
      scrim.onclick = () => done(null);
      box.querySelector("[data-x]").onclick = () => done(null);
      box.onsubmit = (e) => {
        e.preventDefault();
        done(Object.fromEntries(new FormData(box)));
      };
      document.body.append(scrim, box);
      (box.querySelector("input,textarea,select") || box.querySelector("button.primary,button.danger")).focus();
    });
  }
  function drawer(html) {
    closeDrawer();
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.id = "drawer-scrim";
    scrim.onclick = closeDrawer;
    const el = document.createElement("div");
    el.className = "drawer";
    el.id = "drawer";
    el.innerHTML = `<button class="btn small close" data-close>Close</button>${html}`;
    el.querySelector("[data-close]").onclick = closeDrawer;
    document.body.append(scrim, el);
    return el;
  }
  function closeDrawer() {

  // ---- sign-in: email + password; the first time (or a forgotten password) by a link in an email
  function showSignin() {
    $("#shell").hidden = true;

  let codeSent = false;
  const readForm = () => {
    $("#signin-error").textContent = "";

    const email = $("#email").value.trim().toLowerCase();
    store.set("cv-admin-email", email);
    return email;
  };
  $("#signin-form").onsubmit = async (e) => {
    e.preventDefault();
    const email = readForm();
    $("#signin-go").disabled = true;
    try {
      if (codeSent && $("#code").value.trim()) await finishSignIn(await api("POST", "/api/auth/verify", { email, code: $("#code").value.trim() }));
      else await finishSignIn(await api("POST", "/api/auth/password", { email, password: $("#password").value }));
    } catch (e2) {
      $("#signin-error").textContent = 401 === e2.status ? "Wrong email or password. No password yet? Use the sign-in link below the first time." : e2.message;
    } finally {
      $("#signin-go").disabled = false;
    }
  };
  $("#link-go").onclick = async () => {
    const email = readForm();
    if (!$("#email").checkValidity()) return ($("#signin-error").textContent = "Enter your email first.");
    $("#link-go").disabled = true;
    try {
      const r = await api("POST", "/api/auth/start", { email, redirectTo: location.origin + location.pathname });
      codeSent = true;
      $("#sent-note").hidden = false;
      $("#sent-note").textContent = r.demo ? `Local test mode: your code is ${r.code}` : `We emailed a sign-in link to ${email}. Open it to come back here signed in, then set a password so next time you just sign in here.`;
      if (r.demo) $("#code-field").hidden = false;

      $("#signin-error").textContent = e2.message;
    } finally {
      $("#link-go").disabled = false;
    }
  };
  async function finishSignIn(r) {
    TOKEN = r.token;
    try {
      ME = await api("GET", "/api/admin/me");
    } catch (e2) {
      await api("POST", "/api/auth/logout").catch(() => {});
      TOKEN = null;
      ME = null;

      $("#signin-error").textContent = e.message;

    return true;
  }

      <section><div class="row" style="justify-content:space-between"><h4>PREVIEW</h4><div class="tabs" id="pv-lang"><button data-pl="en" class="on">English</button><button data-pl="zh">Chinese</button></div></div><div class="pushcard"><span class="mark">E</span><div><b id="pv-push-title"></b><div class="hint" id="pv-push-body"></div></div></div><iframe class="preview" id="pv-email" title="Email preview"></iframe></section>
      <section><div class="row"><button class="btn primary" id="tpl-save">Save</button><button class="btn" id="tpl-test">Send a test to me</button>${t.edited ? `<button class="btn ghost" id="tpl-reset">Reset to default</button>` : ""}</div><div id="tpl-test-result" class="hint"></div></section>`);
    const sample = { name: "Alex", title: "Sunny 2-bed near Finch Station", reason: "Please add real photos of the bedroom", from: "Linda Li", preview: "Hi! Is the room still available for December?", team: "Downtown trio", status: "Resolved", note: "We suspended the other account.", plan: "ColivEase Plus", state: "active", body: "This is a test announcement." };
    const fill = (s) => String(s || "").replace(/\{\{\s*(\w+)\s*\}\}/g, (_, k) => sample[k] ?? "");
    const read = () => {
      const out = { channels: {}, inapp: { title: {}, body: {} }, push: { title: {}, body: {} }, email: { subject: {}, body: {} } };
      el.querySelectorAll("[data-ch]").forEach((c) => (out.channels[c.dataset.ch] = c.checked));
      el.querySelectorAll("[data-f]").forEach((i) => { const [g, k] = i.dataset.f.split("."); out[g][k][i.dataset.l] = i.value; });
      return out;
    };
    const emailHtml = (subject, body) => `<div style="font-family:Poppins,Arial,sans-serif;background:#F5F7FB;padding:18px"><div style="max-width:520px;margin:auto;background:#fff;border-radius:20px;border:1px solid #E2E8F0;padding:26px"><div style="font:700 20px Fredoka,Poppins,Arial;color:#0B2255"><span style="display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:9px;background:#2865FF;color:#fff;margin-right:8px">E</span>ColivEase</div><h2 style="font:700 20px Fredoka,Poppins,Arial;color:#0B2255;margin:18px 0 12px">${esc(subject)}</h2>${esc(body).split(/\n{2,}/).map((p) => `<p style="font-size:14px;line-height:1.6;color:#33415C;margin:0 0 12px">${p.replace(/\n/g, "<br>")}</p>`).join("")}<a style="display:inline-block;background:#2865FF;color:#fff;text-decoration:none;font-weight:600;padding:11px 20px;border-radius:999px;font-size:14px">${lang === "zh" ? "打开 ColivEase" : "Open ColivEase"}</a></div></div>`;
    const preview = () => {
      const v = read();
      $("#pv-push-title", el).textContent = fill(v.push.title[lang]);
      $("#pv-push-body", el).textContent = fill(v.push.body[lang]);
      $("#pv-email", el).srcdoc = emailHtml(fill(v.email.subject[lang]), fill(v.email.body[lang]));
    };
    let lastField = null;
    el.querySelectorAll("[data-f]").forEach((i) => { i.addEventListener("input", preview); i.addEventListener("focus", () => (lastField = i)); });
    el.querySelectorAll("[data-var]").forEach((b) => (b.onclick = () => {
      const i = lastField || el.querySelector('[data-f="push.body"][data-l="en"]');
      const at = i.selectionStart ?? i.value.length;
      i.value = `${i.value.slice(0, at)}{{${b.dataset.var}}}${i.value.slice(i.selectionEnd ?? at)}`;
      i.focus();
      preview();
    }));
    el.querySelectorAll("[data-pl]").forEach((b) => (b.onclick = () => { lang = b.dataset.pl; el.querySelectorAll("[data-pl]").forEach((x) => x.classList.toggle("on", x === b)); preview(); }));
    preview();
    $("#tpl-save", el).onclick = async () => {
      try { await api("PUT", `/api/admin/notify/templates/${encodeURIComponent(t.kind)}`, read()); toast("Saved. The next notification uses it."); closeDrawer(); VIEWS.notifications(); } catch (e) { toast(e.message); }
    };
    $("#tpl-reset", el) && ($("#tpl-reset", el).onclick = async () => {
      if (!(await dialog({ title: "Go back to the default text?", body: `<p class="hint">Your edits to this notification are removed.</p>`, confirm: "Reset", danger: true }))) return;
      try { await api("DELETE", `/api/admin/notify/templates/${encodeURIComponent(t.kind)}`); toast("Back to the default"); closeDrawer(); VIEWS.notifications(); } catch (e) { toast(e.message); }
    });
    $("#tpl-test", el).onclick = async () => {
      $("#tpl-test-result", el).textContent = "Sending…";
      try {
        const { results } = await api("POST", "/api/admin/notify/test", { kind: t.kind });
        $("#tpl-test-result", el).innerHTML = results.length ? results.map((r) => `<span class="tag ${r.status === "sent" ? "green" : r.status === "failed" ? "red" : ""}">${CH_LABEL[r.channel]}: ${r.status}</span> <span class="hint">${esc(r.detail || "")}</span>`).join("<br>") : "Nothing was sent (all channels are off).";
      } catch (e) { $("#tpl-test-result", el).textContent = e.message; }
    };
  }

  // Admins
  const PERMS = [["users.read", "See users"], ["users.suspend", "Suspend users"], ["users.write", "Edit users"], ["users.delete", "Delete users"], ["listings.read", "See homes"], ["listings.write", "Review homes"], ["chats.read", "Read chats"], ["chats.write", "Delete messages"], ["reports.write", "Handle reports"], ["plans.write", "Manage memberships"], ["settings.write", "Site settings"], ["broadcast", "Broadcast"], ["admins.write", "Manage admins"], ["audit.read", "Audit log"]];
  VIEWS.admins = async () => {
    loading();
    const { admins, roles } = await api("GET", "/api/admin/admins");
    const has = (role, p) => roles[role].includes(p) || (p === "users.suspend" && roles[role].includes("users.write"));
    $("#main").innerHTML = `${page("Admins & roles", "Who can get in, and what they can do")}
      <div class="grid2">
        <div class="card panel"><h3>Admins</h3><div class="list">${admins.map((a) => `<div class="item"><div><b>${esc(a.email)}</b><span class="sub">${a.fixed ? "Owner (set on the server)" : `Added by ${esc(a.addedBy || "—")}`}</span></div><div class="row"><span class="tag amber">${ROLE[a.role] || a.role}</span>${!a.fixed && can("admins.write") ? `<button class="btn small danger" data-rm="${esc(a.accountId)}">Remove</button>` : ""}</div></div>`).join("")}</div>
          ${can("admins.write") ? `<form id="add" class="row" style="margin-top:14px"><input class="input" name="email" type="email" required placeholder="Their ColivEase sign-in email" style="flex:1;min-width:200px"><select class="input" name="role" style="width:auto"><option value="admin">Admin</option><option value="moderator">Moderator</option><option value="support">Support (read-only)</option></select><button class="btn primary">Add</button></form><p class="hint">They need to have signed in to ColivEase with this email once.</p>` : ""}
        </div>
        <div class="card panel tablewrap"><h3>What each role can do</h3><table class="matrix"><thead><tr><th>Permission</th>${Object.keys(roles).map((r) => `<th>${ROLE[r]}</th>`).join("")}</tr></thead><tbody>${PERMS.map(([p, l]) => `<tr><td>${l}</td>${Object.keys(roles).map((r) => `<td>${has(r, p) ? "✓" : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      </div>`;
    $("#add") && ($("#add").onsubmit = async (e) => {
      e.preventDefault();
      try { await api("PUT", "/api/admin/admins", Object.fromEntries(new FormData(e.target))); toast("Added"); VIEWS.admins(); } catch (er) { toast(er.message); }
    });
    $("#main").querySelectorAll("[data-rm]").forEach((b) => (b.onclick = async () => {
      if (!(await dialog({ title: "Remove this admin?", confirm: "Remove", danger: true }))) return;
      try { await api("DELETE", `/api/admin/admins/${encodeURIComponent(b.dataset.rm)}`); toast("Removed"); VIEWS.admins(); } catch (er) { toast(er.message); }
    }));
  };

  // Audit log
  VIEWS.audit = async () => {
    loading();
    const { entries } = await api("GET", "/api/admin/audit?limit=300");
    $("#main").innerHTML = `${page("Audit log", "Every admin change and every chat opened: who, when and why")}
      <div class="card tablewrap">${entries.length ? `<table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th><th>Reason</th><th>Details</th></tr></thead><tbody>${entries.map((e) => `<tr><td>${fmt(e.at)}</td><td>${esc(e.admin || e.admin_id)}</td><td>${esc(ACTION[e.action] || e.action)}</td><td style="word-break:break-all">${esc(e.target || "—")}</td><td>${esc(e.reason || "—")}</td><td style="max-width:280px;word-break:break-all"><span class="sub">${esc(e.detail ? JSON.stringify(e.detail) : "")}</span></td></tr>`).join("")}</tbody></table>` : `<div class="empty">Nothing recorded yet.</div>`}</div>`;
  };

  fromEmailLink().then((handled) => {
    if (handled) return;
    if (TOKEN && API) start();
    else showSignin();
  });
})();
</script>
</body>
</html>
